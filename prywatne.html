<style>

<body class="gp">
<div class="g-wrap pw">
  <nav class="pw-tabs" id="tabs" role="tablist" aria-label="Opisy prywatne"></nav>
  <main id="main" aria-live="polite"><p class="pw-empty">Wczytuję…</p></main>
  <div id="dls" hidden></div>
</div>
<div id="toast" class="pw-toast" role="status" aria-live="polite"></div>
<script src="wspolne.js?v=1"></script>
<script src="prywatne-katalog.js?v=1"></script>
<script>
/* Opisy prywatne: wizyta z wieloma procedurami → opis do dokumentacji; cennik dla każdego gabinetu, wynagrodzenie lekarza
   (% po odjęciu kosztów albo kwota), historia, zarobki. Dane zaszyfrowane w przestrzeni użytkownika (G.store); bez punktów NFZ. */
'use strict';
if (!G.hint()) G.goLogin('prywatne');
G.bar('prywatne');
const $ = s => document.querySelector(s), esc = G.esc, zl = G.zl;
const KAT0 = window.PRYW_KATALOG;                                 // katalog domyślny (plik) – zmiany użytkownika są w UK (zaszyfrowane)
let UK = { v: 1, over: {}, hist: {}, custom: [], hidden: [], fav: [] }, ZES = { v: 1, list: [] };
let ALL = [], KAT = { kat: KAT0.kat, proc: [] }, PROC = new Map();
const KATN = Object.fromEntries(KAT0.kat.map(k => [k.id, k.name]));
const clone = o => JSON.parse(JSON.stringify(o));
function buildCatalog() {                                          // katalog efektywny: domyślny ← wersje użytkownika + własne procedury
  const out = [];
  KAT0.proc.forEach(p => { const o = UK.over[p.id]; out.push(o ? Object.assign(clone(o.def), { id: p.id, _ver: o.ver, _at: o.at }) : Object.assign(clone(p), { _ver: 1 })); });
  (UK.custom || []).forEach(id => { const o = UK.over[id]; if (o) out.push(Object.assign(clone(o.def), { id, _ver: o.ver, _at: o.at, _custom: true })); });
  ALL = out; PROC = new Map(out.map(p => [p.id, p]));
  const fav = UK.fav || [];
  KAT = { kat: KAT0.kat, proc: out.filter(p => !(UK.hidden || []).includes(p.id)) };
  KAT.fav = fav.map(id => PROC.get(id)).filter(p => p && !(UK.hidden || []).includes(p.id));
}
buildCatalog();
const DOW = ['niedziela', 'poniedziałek', 'wtorek', 'środa', 'czwartek', 'piątek', 'sobota'];
const S = { ready: false, tab: 'wiz', visits: new Map(), bodies: new Map(), allBodies: false, clinics: [], gabAuto: '',
  cennik: { v: 1, gab: {} }, ust: { podpis: '', kasuj: 0 }, q: '', kat: '', pickOpen: false,
  hist: { q: '', gab: '*', kat: '', lim: 40, open: {} }, zar: { r: 'month', od: '', do: '', kat: '', gab: '*', per: 'd' }, cen: { gab: null } };
let V = newVisit();

/* ---------- pomocnicze ---------- */
const UIKEY = () => 'pryw@' + (G.hint() || '-') + '.ui';
function uiLoad() { try { const u = JSON.parse(localStorage.getItem(UIKEY()) || '{}'); if (['wiz', 'hist', 'zar', 'cen', 'tpl', 'zes', 'ust'].includes(u.tab)) S.tab = u.tab; S.quick = !!u.quick; } catch (e) { } }
function uiSave() { try { localStorage.setItem(UIKEY(), JSON.stringify({ tab: S.tab, quick: !!S.quick })); } catch (e) { } }
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const validDate = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(new Date(s + 'T12:00'));
const isoAdd = (s, n) => { const d = new Date(s + 'T12:00'); d.setDate(d.getDate() + n); return iso(d); };
const fmtD = s => s ? s.slice(8, 10) + '.' + s.slice(5, 7) + '.' + s.slice(0, 4) : '';
const dowOf = s => DOW[new Date(s + 'T12:00').getDay()];
const uid = () => Math.random().toString(36).slice(2, 9);
const newId = () => 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const plural = (n, a, b, c) => n === 1 ? a : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14)) ? b : c;
const normIni = s => String(s || '').replace(/[\u0000-\u001f<>]/g, '').trim().toUpperCase().replace(/\s+/g, ' ').slice(0, 10);
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2600); }
function arm(el, msg) {                                           // drugie kliknięcie potwierdza
  if (el.dataset.armed === '1') return true;
  el.dataset.armed = '1'; const old = el.textContent; el.textContent = msg;
  setTimeout(() => { if (el.isConnected) { el.dataset.armed = ''; el.textContent = old; } }, 3500); return false;
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; }
  catch (e) { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (_) { } ta.remove(); return ok; }
}

/* ---------- kwoty (grosze, liczby całkowite) ---------- */
function parseZl(s) { s = String(s == null ? '' : s).replace(/[\s ]|zł/g, '').replace(',', '.'); if (s === '') return null; const n = +s; return isFinite(n) && n >= 0 && n < 1e7 ? Math.round(n * 100) : NaN; }
function parsePct(s) { s = String(s == null ? '' : s).replace(',', '.').replace('%', '').trim(); if (s === '') return null; const n = +s; return isFinite(n) && n >= 0 && n <= 100 ? Math.round(n * 100) / 100 : NaN; }
const zlIn = c => c == null || isNaN(c) ? '' : (c / 100).toFixed(2).replace('.', ',').replace(/,00$/, '');
const pctIn = p => p == null || isNaN(p) ? '' : String(p).replace('.', ',');
function payOf(it) {                                               // wartość, podstawa i wynagrodzenie lekarza za pozycję
  const q = Math.min(99, Math.max(1, Math.round(+it.qty) || 1)), val = (it.c || 0) * q;
  if (it.m === 'kw') return { val, base: val, pay: (it.kw || 0) * q, q };
  const base = Math.max(0, val - (it.cost || 0));
  if (it.p == null || isNaN(it.p)) return { val, base, pay: null, q };
  return { val, base, pay: Math.floor((base * Math.round(it.p * 100) + 5000) / 10000), q };
}
function totals(items) {
  let val = 0, pay = 0, cost = 0, noPay = 0, noPrice = 0;
  (items || V.items).forEach(it => { const r = payOf(it); val += r.val; cost += it.m === 'kw' ? 0 : (it.cost || 0); if (r.pay == null) noPay++; else pay += r.pay; if (it.c == null) noPrice++; });
  return { val, pay, cost, noPay, noPrice };
}

/* ---------- szablony: {pole}, {?pole}…{/pole}, {!pole}…{/pole} ---------- */
function tplParse(s) {
  const re = /\{([?!/]?)([A-Za-z0-9_]+)\}/g, root = { ch: [] }, st = [root]; let last = 0, m;
  while ((m = re.exec(s))) {
    if (m.index > last) st[st.length - 1].ch.push(s.slice(last, m.index));
    last = re.lastIndex;
    if (m[1] === '?' || m[1] === '!') { const n = { op: m[1], k: m[2], ch: [] }; st[st.length - 1].ch.push(n); st.push(n); }
    else if (m[1] === '/') { for (let i = st.length - 1; i > 0; i--) if (st[i].k === m[2]) { st.length = i; break; } }
    else st[st.length - 1].ch.push({ k: m[2] });
  }
  if (last < s.length) st[st.length - 1].ch.push(s.slice(last));
  return root;
}
const TPLC = new Map();
const tplOf = s => { let t = TPLC.get(s); if (!t) { t = tplParse(String(s || '')); TPLC.set(s, t); } return t; };
function tplRun(n, get) { return n.ch.map(c => typeof c === 'string' ? c : c.op ? (((get(c.k, true) !== '') === (c.op === '?')) ? tplRun(c, get) : '') : get(c.k, false)).join(''); }
const clean = s => String(s == null ? '' : s).replace(/\s+/g, ' ').trim().replace(/[.;,]+$/, '').trim();
const FDI = /^([1-4][1-8]|[5-8][1-5])$/;
function teethOf(s) { return String(s || '').split(/[^0-9]+/).filter(Boolean); }
function teethBad(s) { return teethOf(s).filter(t => !FDI.test(t)); }
const FCACHE = new WeakMap();
function fieldsOf(p) { let m = FCACHE.get(p); if (!m) { m = new Map((p.fields || []).map(f => [f.k, f])); FCACHE.set(p, m); } return m; }
const isEmpty = v => v == null || v === '' || v === false || (Array.isArray(v) && !v.length);
function visible(f, vals) {
  const s = f.show; if (!s) return true; const v = vals[s.k];
  if (s.has) return Array.isArray(v) && v.includes(s.has);
  if (s.eq) return v === s.eq;
  if (isEmpty(v)) return false;
  return !(s.not && s.not.includes(v));
}
function fmtVal(f, v) {
  if (v == null) return '';
  switch (f.t) {
    case 'multi': { if (!Array.isArray(v)) return ''; const o = f.opts || []; return v.filter(x => typeof x === 'string' && x).sort((a, b) => ((o.indexOf(a) + 1) || 999) - ((o.indexOf(b) + 1) || 999)).join(f.join != null ? f.join : ', '); }
    case 'bool': return v ? 'tak' : '';
    case 'tooth': case 'teeth': { const s = clean(v); return /^[\d\s,;]+$/.test(s) ? teethOf(s).join(', ') : s; }
    case 'rows': { if (!Array.isArray(v)) return ''; const t = tplOf(f.fmt || ''); return v.filter(r => r && Object.values(r).some(x => clean(x))).map(r => clean(tplRun(t, k => clean(r[k])))).join('; '); }
    case 'num': return clean(v).replace('.', ',');
    case 'date': return validDate(v) ? fmtD(v) : clean(v);
    default: return clean(v);
  }
}
function tidy(s) {

  if (r === 'year') return [y + '-01-01', y + '-12-31'];

  if (r === 'own') return [validDate(S.zar.od) ? S.zar.od : '0000-01-01', validDate(S.zar.do) ? S.zar.do : '9999-12-31'];
  return [iso(new Date(y, mo, 1)), iso(new Date(y, mo + 1, 0))];

  return { a, b, rows };
}
