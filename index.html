<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gabinet</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#f2f5f5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="wspolne.css?v=1">
</head>
<body class="gp">
<main id="app" aria-live="polite"></main>
<script src="wspolne.js?v=1"></script>
<script>
/* Strona główna: logowanie, nowy użytkownik, kod odzyskiwania, przeniesienie starych danych, trzy moduły, okno Zarobki, konto. */
(function () {
  'use strict';
  const $ = s => document.querySelector(s), app = $('#app'), esc = G.esc;
  const q = new URLSearchParams(location.search), wroc = q.get('wroc'), powod = q.get('p');
  const HREF = { kalendarz: 'kalendarz.html', nfz: 'nfz.html', prywatne: 'prywatne.html' };
  const DOW = ['niedziela', 'poniedziałek', 'wtorek', 'środa', 'czwartek', 'piątek', 'sobota'];
  const MON = ['stycznia', 'lutego', 'marca', 'kwietnia', 'maja', 'czerwca', 'lipca', 'sierpnia', 'września', 'października', 'listopada', 'grudnia'];
  let sel = G.hint(), range = 'month';

  function busy(t) { let b = $('.g-busy'); if (!t) { if (b) b.remove(); return; } if (!b) { b = document.createElement('div'); b.className = 'g-busy'; b.setAttribute('role', 'status'); document.body.appendChild(b); } b.innerHTML = '<div>' + esc(t) + '</div>'; }
  const errBox = e => e ? '<div class="g-err" role="alert">' + esc(e) + '</div>' : '';
  const userBtn = u => '<button type="button" class="g-user" data-u="' + esc(u.id) + '" aria-pressed="' + (sel === u.id) + '"><span class="gbar-av">' + esc(u.name.charAt(0).toUpperCase()) + '</span>' + esc(u.name) + '</button>';
  const head = '<h1 style="display:flex;align-items:center;gap:10px;color:var(--g-accent)"><svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><path d="M16 4c-3 0-4.4 1.6-7 1.6C5.8 5.6 4 8 4 11.6c0 5.6 2.3 15.4 5.6 15.4 2.3 0 2.2-6.6 6.4-6.6s4.1 6.6 6.4 6.6c3.3 0 5.6-9.8 5.6-15.4C28 8 26.2 5.6 23 5.6 20.4 5.6 19 4 16 4z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg>Gabinet</h1>';

  /* ---------- logowanie ---------- */
  function showLogin(err) {
    const us = G.users(); if (!us.some(u => u.id === sel)) sel = us[0].id;
    const cur = us.find(u => u.id === sel);
    app.innerHTML = '<div class="g-narrow"><div class="g-card">' + head +
      (powod === 'blokada' ? '<div class="g-warn">Aplikacja została zablokowana. Zaloguj się ponownie – wrócisz do miejsca, w którym skończyłeś.</div>' : '') +
      '<h2>Zaloguj się</h2><div class="g-users" role="group" aria-label="Użytkownik">' + us.map(userBtn).join('') + '</div>' +
      '<form id="f-login" autocomplete="on"><input type="text" name="username" autocomplete="username" value="' + esc(cur.name) + '" hidden>' +
      '<div class="g-field"><label for="pw">Hasło</label><input id="pw" name="password" type="password" class="g-in" autocomplete="current-password" required></div>' + errBox(err) +
      '<button class="g-btn" type="submit" style="width:100%">Zaloguj</button></form>' +
      '<div class="g-row" style="justify-content:space-between;margin-top:8px"><button type="button" class="g-link" data-a="forgot">Nie pamiętam hasła</button><button type="button" class="g-link" data-a="newuser">Dodaj użytkownika</button></div></div>' +
      '<p class="g-small g-muted">Każdy użytkownik ma własne hasło i widzi wyłącznie swoje dane. Dane są zaszyfrowane i zapisane tylko na tym urządzeniu.</p></div>';
    $('#pw').focus();
    $('#f-login').onsubmit = async e => {
      e.preventDefault(); busy('Sprawdzam hasło…');
      try { await G.login(sel, $('#pw').value); busy(); await enter(); } catch (x) { busy(); showLogin(x.message); }
    };
  }

  /* ---------- nowy użytkownik ---------- */
  function showSetup(first, err) {
    app.innerHTML = '<div class="g-narrow"><div class="g-card">' + head +
      (first ? '<p class="g-muted">Kalendarz, Opisy NFZ i Opisy prywatne w jednej aplikacji. Dane zapisują się tylko na tym urządzeniu, zaszyfrowane Twoim hasłem.</p><h2>Załóż konto</h2>' : '<h2>Nowy użytkownik</h2><p class="g-muted g-small">Nowy użytkownik ma osobne, puste dane i własne hasło.</p>') +
      '<form id="f-setup"><div class="g-field"><label for="nm">Imię lub nazwa</label><input id="nm" class="g-in" autocomplete="username" maxlength="40" required></div>' +
      '<div class="g-field"><label for="p1">Hasło (min. 6 znaków, może być PIN)</label><input id="p1" type="password" class="g-in" autocomplete="new-password" minlength="6" required></div>' +
      '<div class="g-field"><label for="p2">Powtórz hasło</label><input id="p2" type="password" class="g-in" autocomplete="new-password" minlength="6" required></div>' + errBox(err) +
      '<p class="g-small g-muted">Po utworzeniu konta zobaczysz <b>kod odzyskiwania</b>. Bez hasła i bez tego kodu danych nie da się odczytać – także dla autora aplikacji.</p>' +
      '<button class="g-btn" type="submit" style="width:100%">Utwórz konto</button></form>' +
      (first ? '' : '<button type="button" class="g-link" data-a="login">Wróć do logowania</button>') + '</div></div>';
    $('#nm').focus();
    $('#f-setup').onsubmit = async e => {
      e.preventDefault();
      if ($('#p1').value !== $('#p2').value) { showSetup(first, 'Hasła różnią się.'); return; }
      busy('Tworzę konto i klucz szyfrowania…');
      try { const r = await G.createUser($('#nm').value, $('#p1').value); sel = r.user.id; busy(); G.user = r.user; G.key = (await G.session()).key; showCode(r.code, first); }
      catch (x) { busy(); showSetup(first, x.message); }
    };
  }
  function showCode(code, first, again) {
    app.innerHTML = '<div class="g-narrow"><div class="g-card"><h2>Kod odzyskiwania</h2>' +
      '<p>Zapisz ten kod poza tym urządzeniem (np. na kartce w bezpiecznym miejscu). Pozwoli ustawić nowe hasło, gdy zapomnisz obecnego.</p>' +
      '<div class="g-code" id="code">' + esc(code) + '</div><div class="g-row" style="margin:10px 0"><button type="button" class="g-btn ghost sm" id="cp">Kopiuj</button><button type="button" class="g-btn ghost sm" id="pr">Drukuj</button></div>' +
      '<label class="g-row" style="gap:8px;margin:12px 0"><input type="checkbox" id="ok" style="width:20px;height:20px"> Zapisałem kod w bezpiecznym miejscu</label>' +
      '<button class="g-btn" id="dalej" disabled style="width:100%">Dalej</button></div></div>';
    $('#cp').onclick = async () => { try { await navigator.clipboard.writeText(code); $('#cp').textContent = 'Skopiowano'; } catch (e) { $('#cp').textContent = 'Zaznacz kod i skopiuj'; } };
    $('#pr').onclick = () => window.print();
    $('#ok').onchange = () => { $('#dalej').disabled = !$('#ok').checked; };
    $('#dalej').onclick = async () => { if (again) { renderDash(); return; } if (first) await migrateStep(); else await enter(); };
  }
  async function migrateStep() {
    const d = await G.legacy.detect();
    if (!d.any) { await enter(); return; }
    busy('Przenoszę i szyfruję dotychczasowe dane…');
    let r; try { r = await G.legacy.migrate(); } catch (e) { r = { errors: [e.message] }; }
    busy();
    const li = [], pl = (n, a, b, c) => n + ' ' + (n === 1 ? a : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14)) ? b : c);
    if (r.nfz || r.nfzLS) li.push('Opisy NFZ: ' + pl((r.nfz || 0) + (r.nfzLS || 0), 'wpis', 'wpisy', 'wpisów'));
    if (r.nfzV9) li.push('Opisy NFZ (starsza wersja): ' + pl(r.nfzV9, 'wpis', 'wpisy', 'wpisów') + ' – przeniosą się przy pierwszym otwarciu modułu');
    if (r.grafik) li.push('Kalendarz: ' + (d.grafik ? pl(d.grafik.shifts, 'dyżur', 'dyżury', 'dyżurów') + ', ' + pl(d.grafik.clinics, 'gabinet', 'gabinety', 'gabinetów') : 'przeniesiony'));
    app.innerHTML = '<div class="g-narrow"><div class="g-card"><h2>Dotychczasowe dane</h2>' +
      (li.length ? '<p class="g-ok">Przeniesione do Twojego konta i zaszyfrowane:</p><ul>' + li.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul><p class="g-small g-muted">Jawne kopie zostały usunięte dopiero po sprawdzeniu, że zaszyfrowane dane dają się odczytać.</p>' : '') +
      (r.errors && r.errors.length ? '<div class="g-err">Nie wszystko udało się przenieść: ' + esc(r.errors.join('; ')) + '. Dane, których nie przeniesiono, zostały na miejscu.</div>' : '') +
      '<button class="g-btn" id="dalej" style="width:100%">Przejdź do aplikacji</button></div></div>';
    $('#dalej').onclick = () => enter();
  }
  function showForgot(err) {
    const us = G.users();
    app.innerHTML = '<div class="g-narrow"><div class="g-card"><h2>Nowe hasło z kodem odzyskiwania</h2><div class="g-users" role="group" aria-label="Użytkownik">' + us.map(userBtn).join('') + '</div>' +
      '<form id="f-rec"><div class="g-field"><label for="rc">Kod odzyskiwania</label><input id="rc" class="g-in" autocomplete="off" autocapitalize="characters" spellcheck="false" required></div>' +
      '<div class="g-field"><label for="p1">Nowe hasło</label><input id="p1" type="password" class="g-in" autocomplete="new-password" minlength="6" required></div>' +
      '<div class="g-field"><label for="p2">Powtórz nowe hasło</label><input id="p2" type="password" class="g-in" autocomplete="new-password" minlength="6" required></div>' + errBox(err) +
      '<button class="g-btn" type="submit" style="width:100%">Ustaw hasło i zaloguj</button></form><button type="button" class="g-link" data-a="login">Wróć do logowania</button></div></div>';
    $('#f-rec').onsubmit = async e => {
      e.preventDefault(); if ($('#p1').value !== $('#p2').value) { showForgot('Hasła różnią się.'); return; }
      busy('Sprawdzam kod…'); try { await G.recover(sel, $('#rc').value, $('#p1').value); busy(); await enter(); } catch (x) { busy(); showForgot(x.message); }
    };
  }
  app.addEventListener('click', e => {
    const u = e.target.closest('[data-u]'); if (u) { sel = u.dataset.u; app.querySelectorAll('[data-u]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.u === sel))); const h = app.querySelector('input[name=username]'); if (h) h.value = (G.users().find(x => x.id === sel) || {}).name || ''; const pw = $('#pw'); if (pw) pw.focus(); return; }
    const a = e.target.closest('[data-a]'); if (!a) return;
    if (a.dataset.a === 'forgot') showForgot();
    if (a.dataset.a === 'newuser') showSetup(false);
    if (a.dataset.a === 'login') showLogin();
  });

  /* ---------- po zalogowaniu ---------- */
  async function enter() {
    if (wroc && HREF[wroc]) { location.replace(HREF[wroc]); return; }
    if (powod) history.replaceState(null, '', 'index.html' + location.hash);
    await G.ready('start');
    renderDash();
  }
  const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  function rangeOf(r) {
    const t = new Date(), y = t.getFullYear(), m = t.getMonth();
    if (r === 'today') return [iso(t), iso(t)];
    if (r === 'week') { const dw = (t.getDay() + 6) % 7, a = new Date(y, m, t.getDate() - dw), b = new Date(y, m, t.getDate() - dw + 6); return [iso(a), iso(b)]; }
    if (r === 'prev') return [iso(new Date(y, m - 1, 1)), iso(new Date(y, m, 0))];
    if (r === 'year') return [y + '-01-01', y + '-12-31'];
    return [iso(new Date(y, m, 1)), iso(new Date(y, m + 1, 0))];
  }
  function sumRange(map, a, b) {   // map: data → gabinet → liczby (grosze); wynik: gabinet → suma
    const out = {}; if (!map) return out;
    Object.keys(map).forEach(d => { if (d < a || d > b) return; const g = map[d] || {}; Object.keys(g).forEach(c => { const o = out[c] || (out[c] = {}); Object.keys(g[c]).forEach(k => { o[k] = (o[k] || 0) + (+g[c][k] || 0); }); }); });
    return out;
  }
  function nfzBasis() { try { const c = JSON.parse(localStorage.getItem('opisyNFZ@' + G.user.id + '.cfg') || '{}'); return c.basis === 'share' ? 'share' : 'full'; } catch (e) { return 'full'; } }
  const tShort = t => { if (!t) return ''; const h = +t.slice(0, 2), m = t.slice(3, 5); return m === '00' ? String(h) : h + ':' + m; };

  async function renderDash() {
    const now = new Date(), today = iso(now);
    const [nfz, pryw, kal, cls, gr] = await Promise.all([G.sums.get('nfz'), G.sums.get('pryw'), G.sums.get('kal'), G.clinics(true), G.grafik(true)]);
    const cname = id => { const c = cls.find(x => x.id === id); return c ? c.name : 'bez gabinetu'; };
    // kafelki
    let kalTxt = 'Ustaw gabinety i dni pracy – dyżury wpiszą się same.';
    if (gr && gr.settings) {
      const shifts = d => { const m = gr['m' + d.slice(0, 7)]; return m && Array.isArray(m.shifts) ? m.shifts.filter(s => s.date === d && s.status !== 'cancelled').sort((a, b) => String(a.start).localeCompare(String(b.start))) : []; };
      const td = shifts(today);
      if (td.length) kalTxt = 'Dziś: ' + td.map(s => esc((cls.find(c => c.id === s.clinicId) || {}).short || cname(s.clinicId)) + ' ' + tShort(s.start) + '–' + tShort(s.end)).join(', ');
      else { let nx = null; for (let i = 1; i <= 60 && !nx; i++) { const d = iso(new Date(now.getFullYear(), now.getMonth(), now.getDate() + i)); const s = shifts(d); if (s.length) nx = [d, s[0]]; }
        kalTxt = 'Dziś bez dyżuru' + (nx ? ' · najbliższy: ' + DOW[new Date(nx[0] + 'T12:00').getDay()].slice(0, 3) + '. ' + nx[0].slice(8) + '.' + nx[0].slice(5, 7) + ', ' + esc((cls.find(c => c.id === nx[1].clinicId) || {}).short || '') + ' ' + tShort(nx[1].start) + '–' + tShort(nx[1].end) : ''); }
    }
    const basis = nfzBasis();
    const dayN = sumRange(nfz, today, today), dayP = sumRange(pryw, today, today);
    const tot = (o, f) => Object.values(o).reduce((s, x) => s + f(x), 0);
    const nfzEarn = x => (basis === 'share' ? (x.sh || 0) : (x.pc || 0)) + (x.rv || 0) + (x.ex || 0);
    const nN = tot(dayN, x => x.n || 0), nZ = tot(dayN, nfzEarn), pN = tot(dayP, x => x.n || 0), pZ = tot(dayP, x => x.pay || 0);
    const vis = n => n + ' ' + (n === 1 ? 'wizyta' : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14)) ? 'wizyty' : 'wizyt');
    const icon = p => '<span class="ti"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + p + '</svg></span>';
    const tile = (href, ic, name, txt) => '<a class="g-tile" href="' + href + '">' + icon(ic) + '<b>' + name + '</b><span class="ts">' + txt + '</span><span class="tn">Otwórz →</span></a>';
    const [a, b] = rangeOf(range);
    const zN = sumRange(nfz, a, b), zP = sumRange(pryw, a, b), zK = sumRange(kal, a, b);
    const ids = [...new Set([...cls.map(c => c.id), ...Object.keys(zN), ...Object.keys(zP), ...Object.keys(zK)])]
      .filter(id => cls.some(c => c.id === id && c.active) || zN[id] || zP[id] || zK[id]);
    ids.sort((x, y) => (x === '' ? 1 : 0) - (y === '' ? 1 : 0));
    const rows = ids.map(id => { const n = zN[id] || {}, p = zP[id] || {}, k = zK[id] || {}; const e1 = nfzEarn(n), e2 = p.pay || 0;
      const c = cls.find(x => x.id === id);
      return { name: (c ? '<span class="g-dot" style="background:var(--c' + (c.color || 1) + ',#888)"></span>' + esc(c.name) : 'Bez gabinetu'), nv: n.n || 0, e1, pv: p.n || 0, e2, sum: e1 + e2, k: k.inc || 0 }; });
    const T = rows.reduce((s, r) => ({ nv: s.nv + r.nv, e1: s.e1 + r.e1, pv: s.pv + r.pv, e2: s.e2 + r.e2, sum: s.sum + r.sum, k: s.k + r.k }), { nv: 0, e1: 0, pv: 0, e2: 0, sum: 0, k: 0 });
    const z = c => c ? G.zl(c) : '—';
    const RN = { today: 'Dziś', week: 'Ten tydzień', month: 'Ten miesiąc', prev: 'Poprzedni miesiąc', year: 'Ten rok' };
    const lm = G.prefs().lockMin;
    app.innerHTML = '<div class="g-wrap"><p class="g-muted" style="margin:4px 0 2px">' + DOW[now.getDay()] + ', ' + now.getDate() + ' ' + MON[now.getMonth()] + ' ' + now.getFullYear() + '</p>' +
      '<h1 style="margin:0 0 14px;font-size:26px">Dzień dobry, ' + esc(G.user.name) + '</h1>' +
      '<nav class="g-tiles" aria-label="Moduły">' +
      tile('kalendarz.html', '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>', 'Kalendarz', kalTxt) +
      tile('nfz.html', '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/>', 'Opisy NFZ', nN ? 'Dziś: ' + vis(nN) + ' · ' + G.zl(nZ) : 'Dziś brak zapisanych wizyt') +
      tile('prywatne.html', '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M12 11v6M9 14h6"/>', 'Opisy prywatne', pN ? 'Dziś: ' + vis(pN) + ' · ' + G.zl(pZ) : 'Dziś brak zapisanych wizyt') +
      '</nav>' +
      '<section class="g-card" id="zarobki" aria-labelledby="zh"><div class="g-row" style="justify-content:space-between;margin-bottom:10px"><h2 id="zh" style="margin:0">Zarobki – wszystkie gabinety</h2><div class="g-seg" role="group" aria-label="Okres">' +
      Object.keys(RN).map(k => '<button type="button" data-r="' + k + '" class="' + (k === range ? 'on' : '') + '" aria-pressed="' + (k === range) + '">' + RN[k] + '</button>').join('') + '</div></div>' +
      '<p class="g-small g-muted" style="margin:0 0 8px">' + a.split('-').reverse().join('.') + ' – ' + b.split('-').reverse().join('.') + '</p>' +
      (rows.length ? '<div class="g-tblw"><table class="g-tbl"><thead><tr><th>Gabinet</th><th>Wizyty NFZ</th><th>Zarobek NFZ</th><th>Wizyty prywatne</th><th>Zarobek prywatny</th><th>Razem z wizyt</th><th>Dyżury wg Kalendarza</th></tr></thead><tbody>' +
        rows.map(r => '<tr><td>' + r.name + '</td><td>' + (r.nv || '—') + '</td><td>' + z(r.e1) + '</td><td>' + (r.pv || '—') + '</td><td>' + z(r.e2) + '</td><td><b>' + z(r.sum) + '</b></td><td>' + z(r.k) + '</td></tr>').join('') +
        '</tbody><tfoot><tr><td>Razem</td><td>' + (T.nv || '—') + '</td><td>' + z(T.e1) + '</td><td>' + (T.pv || '—') + '</td><td>' + z(T.e2) + '</td><td>' + z(T.sum) + '</td><td>' + z(T.k) + '</td></tr></tfoot></table></div>' : '<p class="g-muted">Brak zapisanych wizyt i dyżurów w tym okresie.</p>') +
      '<p class="g-small g-muted" style="margin:10px 0 0">Zarobek NFZ: ' + (basis === 'share' ? 'udział lekarza w wartości punktów' : 'pełna wartość punktów') + ' + przeglądy + kwoty dodatkowe (jak w Statystykach Opisów NFZ). Zarobek prywatny: wynagrodzenie lekarza z cennika. „Dyżury wg Kalendarza” to przychód z rozliczeń gabinetów – pokazany do porównania i <b>nie</b> doliczany do „Razem”, bo dotyczy tych samych wizyt.</p></section>' +
      '<section class="g-card" id="konto" aria-labelledby="kh"><h2 id="kh">Konto i bezpieczeństwo</h2>' +
      '<p class="g-small g-muted">Dane konta „' + esc(G.user.name) + '” są zaszyfrowane (AES-GCM 256) kluczem dostępnym tylko po podaniu hasła lub kodu odzyskiwania i zapisane wyłącznie na tym urządzeniu.</p>' +
      '<div class="g-field" style="max-width:320px"><label for="lk">Blokada po bezczynności</label><select id="lk" class="g-in">' + [5, 10, 15, 30, 60].map(m => '<option value="' + m + '"' + (m === lm ? ' selected' : '') + '>po ' + m + ' min</option>').join('') + '</select></div>' +
      '<details style="margin:12px 0"><summary style="cursor:pointer;font-weight:600">Zmień hasło</summary><form id="f-pw" style="max-width:360px"><div class="g-field"><label for="o1">Obecne hasło</label><input id="o1" type="password" class="g-in" autocomplete="current-password" required></div><div class="g-field"><label for="n1">Nowe hasło</label><input id="n1" type="password" class="g-in" autocomplete="new-password" minlength="6" required></div><div class="g-field"><label for="n2">Powtórz nowe hasło</label><input id="n2" type="password" class="g-in" autocomplete="new-password" minlength="6" required></div><div id="pw-msg"></div><button class="g-btn sm" type="submit">Zmień hasło</button></form></details>' +
      '<details style="margin:12px 0"><summary style="cursor:pointer;font-weight:600">Nowy kod odzyskiwania</summary><form id="f-rc" style="max-width:360px"><p class="g-small g-muted">Poprzedni kod przestanie działać.</p><div class="g-field"><label for="o2">Hasło</label><input id="o2" type="password" class="g-in" autocomplete="current-password" required></div><div id="rc-msg"></div><button class="g-btn sm" type="submit">Utwórz nowy kod</button></form></details>' +
      '<details style="margin:12px 0"><summary style="cursor:pointer;font-weight:600">Kopia całości (wszystkie moduły, zaszyfrowana)</summary><div style="max-width:420px"><p class="g-small g-muted">Jeden plik z Kalendarzem, Opisami NFZ i Opisami prywatnymi (wizyty, opisy, cenniki, szablony, zestawy, ustawienia), zaszyfrowany hasłem konta z chwili tworzenia kopii. Przechowuj go jak dokumentację; bez hasła nie da się go odczytać. Wczytanie niczego nie kasuje: dodaje brakujące wpisy, istniejące zastępuje tylko nowszą wersją.</p>' +
        '<form id="f-bk"><div class="g-field"><label for="o4">Hasło konta</label><input id="o4" type="password" class="g-in" autocomplete="current-password" required></div><div id="bk-msg"></div><button class="g-btn sm" type="submit">Pobierz kopię całości</button></form>' +
        '<form id="f-bi" style="margin-top:14px"><div class="g-field"><label for="bkf">Plik kopii (.json)</label><input id="bkf" type="file" accept=".json,application/json" class="g-in" required></div><div class="g-field"><label for="o5">Hasło użyte przy tworzeniu kopii</label><input id="o5" type="password" class="g-in" autocomplete="off" required></div><div id="bi-msg"></div><button class="g-btn sm ghost" type="submit">Wczytaj kopię całości</button></form></div></details>' +
      '<details style="margin:12px 0"><summary style="cursor:pointer;font-weight:600;color:var(--g-err)">Usuń konto i wszystkie jego dane</summary><form id="f-del" style="max-width:360px"><p class="g-small">Usuwa z tego urządzenia wszystkie dane użytkownika „' + esc(G.user.name) + '” we wszystkich modułach. Nie da się tego cofnąć.</p><div class="g-field"><label for="o3">Hasło</label><input id="o3" type="password" class="g-in" autocomplete="current-password" required></div><div id="del-msg"></div><button class="g-btn sm danger" type="submit">Usuń konto</button></form></details>' +
      '<hr class="g-sep"><div class="g-row"><button type="button" class="g-btn ghost sm" id="b-lock">Zablokuj</button><button type="button" class="g-btn ghost sm" id="b-sw">Zmień użytkownika</button></div></section></div>';
    app.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { range = b.dataset.r; renderDash(); });
    $('#lk').onchange = () => G.setPrefs({ lockMin: +$('#lk').value });
    $('#b-lock').onclick = () => G.lock('reczna');
    $('#b-sw').onclick = () => G.switchUser();
    $('#f-pw').onsubmit = async e => { e.preventDefault(); const m = $('#pw-msg');
      if ($('#n1').value !== $('#n2').value) { m.innerHTML = errBox('Nowe hasła różnią się.'); return; }
      busy('Zmieniam hasło…'); try { await G.changePassword($('#o1').value, $('#n1').value); busy(); m.innerHTML = '<p class="g-ok">Hasło zmienione.</p>'; e.target.reset(); } catch (x) { busy(); m.innerHTML = errBox(x.message); } };
    $('#f-rc').onsubmit = async e => { e.preventDefault(); busy('Tworzę kod…'); try { const c = await G.newRecoveryCode($('#o2').value); busy(); showCode(c, false, true); } catch (x) { busy(); $('#rc-msg').innerHTML = errBox(x.message); } };
    $('#f-bk').onsubmit = async e => { e.preventDefault(); const m = $('#bk-msg'); busy('Szyfruję kopię…');
      try { const r = await G.backup.export($('#o4').value); busy(); const a = document.createElement('a'); a.href = URL.createObjectURL(r.blob); a.download = r.name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
        m.innerHTML = '<p class="g-ok">Pobrano ' + esc(r.name) + ' – Opisy prywatne: ' + r.n.wizyty + ', Opisy NFZ: ' + r.n.nfz + ' wpisów, Kalendarz i ustawienia.</p>'; e.target.reset(); } catch (x) { busy(); m.innerHTML = errBox(x.message); } };
    $('#f-bi').onsubmit = async e => { e.preventDefault(); const m = $('#bi-msg'), f = $('#bkf').files[0]; if (!f) return; busy('Odszyfrowuję i scalam…');
      try { const r = await G.backup.import(await f.text(), $('#o5').value); busy();
        m.innerHTML = '<p class="g-ok">Wczytano: Opisy prywatne ' + r.wizyty + ', Opisy NFZ ' + r.nfz + ' wpisów, ustawienia/szablony/Kalendarz ' + r.kv + '.' + (r.pominiete.length ? ' Pominięto (już są na tym koncie): ' + esc(r.pominiete.join(', ')) + '.' : '') + ' Sumy odświeżą się po otwarciu modułów.</p>'; e.target.reset(); } catch (x) { busy(); m.innerHTML = errBox(x.message); } };
    $('#f-del').onsubmit = async e => { e.preventDefault(); busy('Usuwam dane…'); try { await G.deleteUser($('#o3').value); busy(); location.replace('index.html'); } catch (x) { busy(); $('#del-msg').innerHTML = errBox(x.message); } };
    if (location.hash === '#konto') { const k = $('#konto'); if (k) k.scrollIntoView(); }
  }

  /* ---------- start ---------- */
  (async () => {
    let lsOk = true; try { localStorage.setItem('gabinet.test', '1'); localStorage.removeItem('gabinet.test'); } catch (e) { lsOk = false; }
    if (!window.crypto || !crypto.subtle || typeof indexedDB === 'undefined' || !indexedDB || !lsOk) { app.innerHTML = '<div class="g-narrow"><div class="g-card">' + head + '<div class="g-err">Ta przeglądarka nie pozwala bezpiecznie zapisywać danych (brak szyfrowania lub bazy danych). Otwórz aplikację w aktualnej przeglądarce, w zwykłym (nie prywatnym) oknie, pod adresem https.</div></div></div>'; return; }
    const s = await G.session().catch(() => null);
    if (s) { await enter(); return; }
    if (!G.users().length) showSetup(true); else showLogin();
  })();
})();
</script>
</body>
</html>
