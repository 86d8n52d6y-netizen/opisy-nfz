<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generator opisów NFZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Plan: narzędzie gabinetowe — stepper u góry, karty zabiegów, odontogram FDI, gotowy tekst do skopiowania. */
:root{
  --bg:#f2f5f5; --surface:#ffffff; --ink:#15262a; --muted:#5a6b70; --line:#d3dddf;
  --accent:#0b6a70; --accent-soft:#dbeeed; --accent-ink:#ffffff;
  --fill:#c62828; --fill-soft:#fde7e5; --warn:#9a5b00; --warn-soft:#fff3dc; --ok:#2e7d4f;
  --font-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1618; --surface:#162124; --ink:#e2ebeb; --muted:#93a6a9; --line:#2a3b3e;
    --accent:#4db6b2; --accent-soft:#15393a; --accent-ink:#06191a;
    --fill:#ff8a80; --fill-soft:#3b1e1d; --warn:#f2b35c; --warn-soft:#33270f; --ok:#6fcf97;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1618; --surface:#162124; --ink:#e2ebeb; --muted:#93a6a9; --line:#2a3b3e;
  --accent:#4db6b2; --accent-soft:#15393a; --accent-ink:#06191a;
  --fill:#ff8a80; --fill-soft:#3b1e1d; --warn:#f2b35c; --warn-soft:#33270f; --ok:#6fcf97;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45}
.wrap{max-width:1080px;margin:0 auto;padding:16px 16px 120px}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
h1 small{display:block;font-size:13px;font-weight:400;color:var(--muted)}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps button{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
.steps button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.steps button:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h2{margin:0 0 4px;font-size:17px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.code{font-family:var(--font-mono);font-weight:600;background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:6px;font-size:14px}
.icd{font-family:var(--font-mono);font-size:12.5px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.tips{margin:6px 0 10px;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.tips li{font-size:12.5px;color:var(--muted);background:var(--bg);border-radius:6px;padding:3px 8px}
.warn{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:7px 10px;font-size:13.5px;margin:8px 0}
.grid{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end}
.f{display:flex;flex-direction:column;gap:4px;min-width:140px}
.f.s{min-width:90px;max-width:120px}.f.l{flex:1 1 320px}.f.full{flex:1 1 100%}
.f>label,.f>.lab{font-size:12.5px;font-weight:600;color:var(--muted)}
.lab .need{color:var(--fill);font-weight:600}
input[type=text],select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%}
input[type=text].empty,select.empty{border-color:var(--fill);background:var(--fill-soft)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.unit{display:flex;align-items:center;gap:6px}.unit span{color:var(--muted);font-size:13px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:inherit;font-size:13.5px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;padding:6px 10px;cursor:pointer}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg.empty button{border-color:var(--fill)}
.btn{font:inherit;font-weight:600;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:9px 16px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{padding:5px 10px;font-size:13px;font-weight:500}
.mini{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:6px;padding:2px 8px;cursor:pointer}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-family:var(--font-mono);font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;padding:5px 9px;cursor:pointer;text-align:left}
.chip small{font-family:var(--font-body);color:var(--muted);margin-left:6px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.chip.on small{color:var(--accent-ink);opacity:.85}
.group{margin-top:12px}.group h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 2px}
.sel-list{display:flex;flex-wrap:wrap;gap:6px;min-height:34px;align-items:center}
.sel-list .code{display:inline-flex;align-items:center;gap:6px}
.sel-list .code button{border:0;background:transparent;color:inherit;cursor:pointer;font-size:15px;line-height:1;padding:0}
.note{font-size:13px;color:var(--muted)}
/* odontogram */
.odo{overflow-x:auto;margin:10px 0 4px;padding-bottom:4px}
.odo-in{display:inline-flex;flex-direction:column;gap:2px;min-width:max-content}
.odo-row{display:flex;justify-content:center;gap:2px}
.odo-row.prim{opacity:.95}
.odo-sep{width:10px;border-left:2px solid var(--line);margin:0 4px}
.odo-mid{height:1px;background:var(--line);margin:4px 0}
.tooth{display:flex;flex-direction:column;align-items:center;gap:1px;padding:2px;border-radius:6px;cursor:pointer;border:1px solid transparent;position:relative}
.tooth .n{font-family:var(--font-mono);font-size:11.5px;color:var(--muted);line-height:1}
.tooth svg{display:block}
.tooth svg polygon,.tooth svg rect{fill:var(--surface);stroke:var(--muted);stroke-width:1}
.tooth.prim svg polygon,.tooth.prim svg rect{stroke-dasharray:2 1.5}
.tooth.inq{background:var(--accent-soft)}
.tooth.sel{background:var(--accent-soft);border-color:var(--accent)}
.tooth.sel .n{color:var(--accent);font-weight:600}
.tooth.sel::after{content:"✓";position:absolute;top:-6px;right:-4px;background:var(--accent);color:var(--accent-ink);border-radius:50%;width:15px;height:15px;font-size:10px;display:flex;align-items:center;justify-content:center}
.tooth svg .on{fill:var(--accent)!important}
.odo.surf .tooth svg polygon:hover,.odo.surf .tooth svg rect:hover{fill:var(--accent-soft)}
.quadbar{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.legend{font-size:12px;color:var(--muted);margin-top:4px}
.tooth-panel{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:10px}
.tooth-panel h4{margin:0 0 8px;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tnum{font-family:var(--font-mono);background:var(--accent);color:var(--accent-ink);border-radius:5px;padding:1px 7px}
.sub{border-top:1px dashed var(--line);margin-top:12px;padding-top:10px}
.sub h4{margin:0 0 8px;font-size:14px}
.sites{display:grid;grid-template-columns:auto repeat(6,minmax(44px,60px));gap:4px 6px;align-items:center;font-size:12.5px}
.sites input{padding:5px;text-align:center}
.sites .h{color:var(--muted);text-align:center;font-family:var(--font-mono)}
/* output */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px;z-index:5}
.bar .in{max-width:1080px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.miss{font-size:14px}.miss b{color:var(--fill)}.miss.okk b{color:var(--ok)}
.out{white-space:pre-wrap;font-family:var(--font-body);font-size:14px;line-height:1.5;background:var(--bg);border-radius:8px;padding:12px;margin:10px 0 0;max-height:520px;overflow:auto;border:1px solid var(--line)}
.out mark{background:var(--fill-soft);color:var(--fill);font-weight:600;border-radius:4px;padding:0 3px}
.out-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
table.sum{border-collapse:collapse;width:100%;font-size:13.5px}
table.sum th,table.sum td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.sum th{color:var(--muted);font-weight:600;font-size:12.5px}
table.sum td.m{font-family:var(--font-mono)}
.copyall{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
.copyall p{margin:0;font-size:14px}
.btn.big{font-size:16px;padding:12px 22px}
.out.all{max-height:none}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
.hidden{display:none!important}
@media (max-width:520px){.f{min-width:120px}.card{padding:12px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Generator opisów zabiegów NFZ<small>Pacjent powyżej 5 r.ż. · wizyta 30 min · szablony z pliku gabinetu</small></h1>
    <nav class="steps" id="steps"></nav>
  </header>
  <main id="main"></main>
</div>
<div class="bar" id="bar"></div>
<div class="toast" id="toast" role="status"></div>
<textarea id="clip" aria-hidden="true" style="position:fixed;left:-9999px;top:0;opacity:0"></textarea>

<script src="szablony.js"></script>
<script>

/* ---------- stan ---------- */
const state = { step:1, codes:[], a:{}, teeth:{}, quads:{}, unknown:[] };
function initDefaults(){ state.a['ST30.czas']='21'; state.a['ST30G.czas']='21'; state.a['1206.canals']=[{}]; }
initDefaults();

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MISS=l=>'\u0001'+l+'\u0002';
function getVal(key){
  if(key.startsWith('T|')){const [,c,t,f]=key.split('|');return ((state.teeth[c]||{})[t]||{f:{}}).f[f];}
  if(key.startsWith('R|')){const [,lk,i,f]=key.split('|');return ((state.a[lk]||[])[+i]||{})[f];}
  return state.a[key];
}
function setVal(key,v){
  if(key.startsWith('T|')){const [,c,t,f]=key.split('|');const o=((state.teeth[c]=state.teeth[c]||{})[t]=state.teeth[c][t]||{s:[],f:{}});o.f[f]=v;return;}
  if(key.startsWith('R|')){const [,lk,i,f]=key.split('|');const arr=state.a[lk]=state.a[lk]||[];arr[+i]=arr[+i]||{};arr[+i][f]=v;return;}
  state.a[key]=v;
}
const str=v=>(v===undefined||v===null)?'':(Array.isArray(v)?v:String(v).trim());
function V(key,label){const v=str(getVal(key));return (Array.isArray(v)?v.length:v)?v:MISS(label);}
function AGE(){const v=parseFloat(String(state.a['sh.age']||'').replace(',','.'));return isNaN(v)?null:v;}
function num(v){return String(v).replace('.',',');}
const has=c=>state.codes.includes(c);
function plural(n,a,b,c){if(n===1)return a;const d=n%10,dd=n%100;return (d>=2&&d<=4&&!(dd>=12&&dd<=14))?b:c;}

/* zęby */
const qd=t=>{const d=Math.floor(t/10);return d<5?d:d-4;};
const isPrim=t=>Math.floor(t/10)>=5;
const isUpper=t=>[1,2,5,6].includes(Math.floor(t/10));
const isAnt=t=>t%10<=3;
const viewLeft=t=>[1,4,5,8].includes(Math.floor(t/10));
function layout(t){
  const vest=isAnt(t)?'W':'B', oral=isUpper(t)?'P':'L', c=isAnt(t)?'I':'O';
  const mr=viewLeft(t);
  return {top:isUpper(t)?vest:oral,bottom:isUpper(t)?oral:vest,left:mr?'D':'M',right:mr?'M':'D',center:c};
}
const SORD=['M','O','I','D','B','W','P','L'];
const STEM={M:'mezjaln',O:'żując',I:'sieczn',D:'dystaln',B:'policzkow',W:'wargow',P:'podniebienn',L:'językow'};
const SNAME={M:'mezjalna',O:'żująca',I:'sieczna',D:'dystalna',B:'policzkowa',W:'wargowa',P:'podniebienna',L:'językowa'};
function surfText(arr){
  const s=SORD.filter(x=>(arr||[]).includes(x)); if(!s.length) return '';
  return s.map((x,i)=>STEM[x]+(i<s.length-1?'o':'ej')).join('-')+' ('+s.join('')+')';
}
function teethOf(code){const o=state.teeth[code]||{};return Object.keys(o).map(Number).sort(sortFDI);}
function sortFDI(a,b){const qa=qd(a),qb=qd(b);if(qa!==qb)return qa-qb;if(isPrim(a)!==isPrim(b))return isPrim(a)?1:-1;return a-b;}
function teethTxt(code,label){const t=teethOf(code);return t.length?t.join(', '):MISS(label||'zęby (diagram)');}
function tv(code,t,f,label){return V('T|'+code+'|'+t+'|'+f,label+' – ząb '+t);}

/* ---------- pola ---------- */
const WEDZ=['Typ I – śluzówkowy','Typ II – dziąsłowy','Typ III – brodawkowy','Typ IV – przezbrodawkowy'];
function examFields(){return [
  {k:'sh.api',label:'API',type:'num',unit:'%',w:'s'},
  {k:'sh.gi',label:'GI (Löe–Silness)',type:'num',w:'s'},
  {k:'sh.wg',label:'Wędzidełko wargi górnej',type:'select',opts:WEDZ},
  {k:'sh.wd',label:'Wędzidełko wargi dolnej',type:'select',opts:WEDZ},
  {k:'sh.al',label:'Alergie',type:'brak'},
  {k:'sh.ch',label:'Choroby ogólnoustrojowe',type:'brak'},
  {k:'sh.lk',label:'Przyjmowane leki na stałe',type:'brak'}];}
function matFields(p,code){
  const m=str(getVal(p+'mat'));
  const f=[{k:p+'mat',label:'Materiał',type:'seg',opts:['kompozyt','glassjonomer RIVA LC'],rer:code}];
  if(m==='kompozyt') f.push({k:p+'name',label:'Nazwa kompozytu',type:'text'});
  f.push({k:p+'color',label:'Kolor',type:'text',w:'s'});
  return f;
}
function matText(p,style){
  const m=str(getVal(p+'mat'));
  if(!m) return MISS('materiał');
  if(m==='kompozyt') return (style==='docx'?'kompozytowy ':'kompozyt ')+V(p+'name','nazwa kompozytu')+', kolor '+V(p+'color','kolor');
  return (style==='docx'?'glassjonomerowy':'glassjonomer')+' RIVA LC, kolor '+V(p+'color','kolor');
}
function surfOf(code,t){return ((state.teeth[code]||{})[t]||{s:[]}).s;}
function surfTxt(code,t){const s=surfText(surfOf(code,t));return s||MISS('powierzchnie – ząb '+t+' (kliknij na diagramie)');}

/* ---------- wspólne fragmenty ---------- */
function apiLine(){const v=str(state.a['sh.api']);return 'Wskaźnik obecności płytki nazębnej - wskaźnik API =  '+(v?num(v).replace('%','')+'%':MISS('API %'));}
function giLine(){
  const g=str(state.a['sh.gi']); if(!g) return 'Wskaźnik stanu dziąseł – GI - '+MISS('GI');
  const n=parseFloat(g.replace(',','.')); let it='Umiarkowane zapalenie dziąseł';
  if(!isNaN(n)) it = n===0?'Brak zapalenia dziąseł':n<=1?'Łagodne zapalenie dziąseł':n<=2?'Umiarkowane zapalenie dziąseł':'Ciężkie zapalenie dziąseł';
  return 'Wskaźnik stanu dziąseł – GI - '+it+'  '+num(g);
}
function examMid(){return [apiLine(),giLine(),
  'Wędzidełko warg górnej : '+V('sh.wg','wędzidełko górne'),
  'Wędzidełko warg dolnej: '+V('sh.wd','wędzidełko dolne'),
  'Wywiad:','Alergie – '+V('sh.al','alergie'),'Choroby ogólnoustrojowe – '+V('sh.ch','choroby ogólne'),'Przyjmowane leki na stałe – '+V('sh.lk','leki')].join('\n');}
function ageGroup(){const a=AGE();if(a===null)return null;return a<4?'1–3':a<7?'4–6':a<11?'7–10':'≥11';}
function instr(){
  const g=ageGroup(); if(!g) return MISS('wiek pacjenta (wybór instruktażu)');
  const p=[];
  if(g==='1–3')p.push(SEG.AGE_1_3); else if(g==='4–6')p.push(SEG.AGE_4_6); else if(g==='7–10')p.push(SEG.AGE_7_10);
  else{p.push(SEG.AGE_11);const m=state.a['sh.meth']||[];if(!m.length)p.push(MISS('metoda szczotkowania (Roll / Bass / Stillman)'));
    if(m.includes('Roll'))p.push(SEG.AGE_11_ROLL);if(m.includes('Bass'))p.push(SEG.AGE_11_BASS);if(m.includes('Stillman'))p.push(SEG.AGE_11_STILL);}
  if(state.a['sh.ortho']==='tak')p.push(SEG.ORTHO);
  return p.join('\n');
}
function byAge(key,fn){const v=str(state.a[key]);if(v)return v;const a=AGE();return a===null?'':fn(a);}

/* ---------- definicje kodów ---------- */
const TITLE_1105='Kod 1105 (postępowanie przy obnażeniu i skaleczeniu miazgi – bezpośrednie pokrycie miazgi)';
const EXT_REASONS=['znacznie zniszczony, odłamanie fragmentu zęba - nienadający się już do odbudowy','złamanie poddziąsłowe korony zęba','resorpcja fizjologiczna','wskazania ortodontyczne','widoczna przetoka przy ww. zębie, brak reakcji na chlorek etylu - ząb martwy','ropień podśluzówkowy - znaczne zniszczenie tkanek - ząb nienadający się do odbudowy','nieodwracalne zapalenie miazgi, samoistny, ciągły  ból zęba, reakcja na chlorek etylu wzmożona'];
const EXT_ANEST=['przewodowe Dentocaine (40mg + 0,005mg)/ml 1 amp','miejscowe nasiękowe Dentocaine (40mg + 0,005mg)/ml 1 amp','miejscowe  powierzchniowe Mark3 20% benzokaina'];
const PREP3=['Dentosept A Mini spray (do 4 r.ż )','Elgydium Clinic Cicalium (od 4 r.ż)','Curasept żel z chlorheksydyną 0,5% CHX  (od 7 r.ż)'];
const prepByAge=a=>a<4?PREP3[0]:a<7?PREP3[1]:PREP3[2];
const prep2ByAge=a=>a<4?PREP3[0]:PREP3[1];

function fillCode(code,cfg){return {
  name:cfg.name,icd:'K02 / K04 / K05 (wg rozpoznania)',tips:cfg.tips,
  diag:{mode:'surf',label:'Zaznacz ząb i kliknij leczone powierzchnie'},
  perTooth:t=>{const p='T|'+code+'|'+t+'|';const f=[];if(cfg.depth)f.push({k:p+'depth',label:'Próchnica',type:'seg',opts:['średnia','głęboka'],rer:code});return f.concat(matFields(p,code));},
  warn:()=>{const w=[];teethOf(code).forEach(t=>{
      if(cfg.prim===true&&!isPrim(t))w.push('Ząb '+t+' jest stały – kod 1108 dotyczy zębów mlecznych.');
      if(cfg.prim===false&&isPrim(t))w.push('Ząb '+t+' jest mleczny – dla zębów mlecznych zwykle 1108.');
      const n=surfOf(code,t).length; if(cfg.surf&&n&&!cfg.surf(n))w.push('Ząb '+t+': zaznaczono '+n+' pow. – '+cfg.surfMsg);});return w;},
  render:()=>{const ts=teethOf(code);const out=[cfg.title];if(!ts.length)out.push(MISS('ząb (diagram)'));
    ts.forEach(t=>out.push(cfg.body(t)));return out.join('\n');}
};}
function body15(code,big){return t=>{const p='T|'+code+'|'+t+'|';const d=str(getVal(p+'depth'));const u=big?'rozległego ubytku':'ubytku';
  if(!d) return 'Ząb '+t+', próchnica '+MISS('średnia / głęboka – ząb '+t);
  if(d==='średnia') return 'Ząb '+t+', próchnica średnia, ubytek na powierzchni '+surfTxt(code,t)+'.\nCałkowite opracowanie i odbudowa '+u+'. Założono materiał:\n'+matText(p,'user');

/* ---------- render pól ---------- */
function fieldHTML(f){
  if(f.sites) return sitesHTML(f.code,f.t);
  const v=getVal(f.k); const s=str(v);
  const empty=(Array.isArray(s)?!s.length:!s);
  const ageDef=f.age&&empty&&AGE()!==null?f.age(AGE()):'';
  const cls='f'+(f.w==='s'?' s':f.w==='l'?' l':'')+(f.full?' full':'');
  const lab=`<span class="lab">${esc(f.label)}${empty&&!ageDef?' <span class="need">· uzupełnij</span>':''}${ageDef?' <span class="note">(wg wieku)</span>':''}</span>`;
  const id='i_'+f.k.replace(/[^a-zA-Z0-9]/g,'_');
  if(f.type==='seg'){
    const cur=s||ageDef;
    return `<div class="${cls}">${lab}<div class="seg${!cur?' empty':''}" role="group">${f.opts.map(o=>`<button type="button" data-act="seg" data-key="${esc(f.k)}" data-v="${esc(o)}" class="${cur===o?'on':''}" aria-pressed="${cur===o}">${esc(o)}</button>`).join('')}</div></div>`;
  }
  if(f.type==='checks'){
    const arr=Array.isArray(v)?v:[];
    return `<div class="${cls}">${lab}<div class="seg${!arr.length?' empty':''}" role="group">${f.opts.map(o=>{const ov=typeof o==='string'?o:o.v, ol=typeof o==='string'?o:o.l;return `<button type="button" data-act="chk" data-key="${esc(f.k)}" data-v="${esc(ov)}" class="${arr.includes(ov)?'on':''}" aria-pressed="${arr.includes(ov)}">${esc(ol)}</button>`;}).join('')}</div></div>`;
  }
  if(f.type==='select'){
    return `<div class="${cls}"><label for="${id}">${esc(f.label)}${empty?' <span class="need">· uzupełnij</span>':''}</label><select id="${id}" data-key="${esc(f.k)}" class="${empty?'empty':''}"><option value="">— wybierz —</option>${f.opts.map(o=>`<option ${s===o?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;
  }
  const dl=f.dl?`<datalist id="dl_${id}">${f.dl.map(o=>`<option value="${esc(o)}">`).join('')}</datalist>`:'';
  const inp=`<input type="text" id="${id}" data-key="${esc(f.k)}" value="${esc(s)}" ${f.type==='num'?'inputmode="decimal"':''} ${f.dl?`list="dl_${id}"`:''} placeholder="${esc(f.ph||'')}" class="${empty&&!f.ph?'empty':''}" autocomplete="off">`;
  const brak=f.type==='brak'?`<button type="button" class="mini" data-act="brak" data-key="${esc(f.k)}">brak</button>`:'';
  return `<div class="${cls}"><label for="${id}">${esc(f.label)}${empty&&!f.ph?' <span class="need">· uzupełnij</span>':''}${empty&&f.ph?' <span class="note">(domyślnie: '+esc(f.ph)+')</span>':''}</label><div class="unit">${inp}${f.unit?`<span>${f.unit}</span>`:''}${brak}</div>${dl}</div>`;
}
function sitesHTML(code,t){
  const row=(f,lab)=>`<div>${lab}</div>`+SITES.map(x=>{const k='T|'+code+'|'+t+'|'+f+x;const s=str(getVal(k));return `<input type="text" inputmode="decimal" data-key="${k}" value="${esc(s)}" aria-label="${lab} ${x} ząb ${t}" class="${s?'':'empty'}">`;}).join('');
  return `<div class="sites"><div></div>${SITES.map(x=>`<div class="h">${x}</div>`).join('')}${row('pd','PD (mm)')}${row('cal','CAL (mm)')}</div>`;
}

const ROWS=[[18,17,16,15,14,13,12,11,0,21,22,23,24,25,26,27,28],[55,54,53,52,51,0,61,62,63,64,65],[85,84,83,82,81,0,71,72,73,74,75],[48,47,46,45,44,43,42,41,0,31,32,33,34,35,36,37,38]];
function toothSVG(code,t,surfs){
  const L=layout(t);const on=x=>surfs.includes(x)?' class="on"':'';
  const P=(pts,s)=>`<polygon points="${pts}" data-act="surf" data-code="${code}" data-t="${t}" data-s="${s}"${on(s)}><title>${SNAME[s]}</title></polygon>`;
  return `<svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">${P('0,0 30,0 21,9 9,9',L.top)}${P('30,0 30,30 21,21 21,9',L.right)}${P('0,30 30,30 21,21 9,21',L.bottom)}${P('0,0 9,9 9,21 0,30',L.left)}<rect x="9" y="9" width="12" height="12" data-act="surf" data-code="${code}" data-t="${t}" data-s="${L.center}"${on(L.center)}><title>${SNAME[L.center]}</title></rect></svg>`;
}
function odoHTML(code,mode){
  const sel=state.teeth[code]||{}; const qs=state.quads[code]||[];
  const rows=ROWS.map((r,ri)=>{const lower=ri>=2;const prim=ri===1||ri===2;
    return `<div class="odo-row${prim?' prim':''}">`+r.map(t=>{if(!t)return '<div class="odo-sep"></div>';
      const isSel=mode==='quad'?qs.includes(qd(t)):!!sel[t];const inq=mode==='mixed'&&qs.includes(qd(t));const surfs=(sel[t]||{}).s||[];
      const n=`<span class="n">${t}</span>`;
      return `<div class="tooth${prim?' prim':''}${isSel?' sel':''}${inq?' inq':''}" data-act="tooth" data-code="${code}" data-t="${t}" role="button" tabindex="0" aria-pressed="${isSel}" aria-label="ząb ${t}">${lower?'':n}${toothSVG(code,t,mode==='surf'?surfs:[])}${lower?n:''}</div>`;}).join('')+'</div>'+(ri===1?'<div class="odo-mid"></div>':'');}).join('');
  let extra='';
  if(mode==='quad'||mode==='mixed') extra=`<div class="quadbar">${[1,2,3,4].map(q=>`<button type="button" class="chip${qs.includes(q)?' on':''}" data-act="quad" data-code="${code}" data-q="${q}">Ćwiartka ${q}<small>${['','prawa górna','lewa górna','lewa dolna','prawa dolna'][q]}</small></button>`).join('')}<button type="button" class="chip" data-act="quadset" data-code="${code}" data-q="1,2">Szczęka</button><button type="button" class="chip" data-act="quadset" data-code="${code}" data-q="3,4">Żuchwa</button><button type="button" class="chip" data-act="quadset" data-code="${code}" data-q="">Wyczyść</button></div>`;
  const leg=mode==='mixed'?'<div class="legend">Ćwiartkę zaznaczasz przyciskami pod diagramem (podświetla się na diagramie), ząb – kliknięciem w ząb. Można jedno albo oba.</div>':mode==='surf'?'<div class="legend">Kliknij numer zęba, by go zaznaczyć; kliknij pole kwadratu, by zaznaczyć powierzchnię (M, D, O/I, B/W, P/L). Linia przerywana = zęby mleczne.</div>':'<div class="legend">Zęby mleczne: rzędy środkowe (linia przerywana).</div>';
  return `<div class="odo${mode==='surf'?' surf':''}"><div class="odo-in">${rows}</div></div>${extra}${leg}`;
}

function cardHTML(code){
  const d=D[code];
  const fields=d.fields?d.fields():[];
  const warns=d.warn?d.warn():[];
  let h=`<section class="card" id="card-${code}"><h2><span class="code">${code}</span>${esc(d.name)}<span class="icd">${esc(d.icd)}</span></h2>`;
  if(d.tips&&d.tips.length) h+=`<ul class="tips">${d.tips.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`;
  h+=warns.map(w=>`<div class="warn">${esc(w)}</div>`).join('');
  if(fields.length) h+=`<div class="grid">${fields.map(fieldHTML).join('')}</div>`;
  if(d.repeat){const r=d.repeat();if(r){const arr=state.a[r.k]||[{}];
    h+=`<div class="sub"><h4>${esc(r.label)}</h4>`+arr.map((row,i)=>`<div class="grid" style="margin-bottom:8px">${r.cols.map(c=>fieldHTML({k:'R|'+r.k+'|'+i+'|'+c.f,label:c.label,type:'text',w:c.w,dl:c.dl})).join('')}<button type="button" class="mini" data-act="delrow" data-key="${r.k}" data-i="${i}" aria-label="usuń kanał">usuń</button></div>`).join('')+`<button type="button" class="btn ghost sm" data-act="addrow" data-key="${r.k}" data-code="${code}">+ dodaj kanał</button></div>`;}}
  if(d.diag){h+=`<div class="sub"><h4>${esc(d.diag.label)}</h4>${odoHTML(code,d.diag.mode)}`;
    if(d.perTooth){teethOf(code).forEach(t=>{const pf=d.perTooth(t);const sv=d.diag.mode==='surf'?surfText(surfOf(code,t)):'';
      h+=`<div class="tooth-panel"><h4><span class="tnum">${t}</span>${isPrim(t)?'<span class="note">mleczny</span>':''}${d.diag.mode==='surf'?(sv?`<span>${esc(sv)}</span>`:'<span class="need" style="color:var(--fill)">kliknij powierzchnie na diagramie</span>'):''}<button type="button" class="mini" data-act="untooth" data-code="${code}" data-t="${t}">usuń ząb</button></h4>${pf.length?`<div class="grid">${pf.map(fieldHTML).join('')}</div>`:''}</div>`;});}
    h+='</div>';}
  if(d.fields2){const f2=d.fields2();if(f2.length)h+=`<div class="sub"><h4>Leczenie w związku z urazem</h4><div class="grid">${f2.map(fieldHTML).join('')}</div></div>`;}
  if(!fields.length&&!d.diag&&!d.repeat) h+=(d.exam||d.instr)?'<p class="note">Pola tego zabiegu są w karcie „Dane pacjenta i badanie” powyżej.</p>':'<p class="note">Szablon nie ma pól do uzupełnienia – opis zostanie wstawiony w całości.</p>';
  return h+'</section>';
}

  const m=missCount();
  if(state.step===2){b.innerHTML=`<div class="in"><span class="miss${m?'':' okk'}">${m?`Do uzupełnienia: <b>${m}</b> ${plural(m,'pole','pola','pól')}`:'<b>Wszystko uzupełnione</b>'}</span><div class="row"><button type="button" class="btn ghost" data-act="step" data-n="1">← Kody</button><button type="button" class="btn" data-act="step" data-n="3">Generuj opis →</button></div></div>`;return;}
  b.innerHTML=`<div class="in"><span class="miss${m?'':' okk'}">${m?`W opisie zostało <b>${m}</b> ${plural(m,'pole','pola','pól')} [UZUPEŁNIJ]`:'<b>Opis kompletny</b>'}</span><div class="row"><button type="button" class="btn ghost" data-act="step" data-n="2">← Pytania</button><button type="button" class="btn ghost" data-act="reset" id="resetBtn">Nowy pacjent</button><button type="button" class="btn" data-act="copyall">Kopiuj wszystko</button></div></div>`;
}
function renderStep1(){
  const sel=state.codes.map(c=>`<span class="code">${c}<button type="button" data-act="rmcode" data-c="${c}" aria-label="usuń ${c}">×</button></span>`).join('');
  return `<section class="card"><h2>Pacjent i wykonane zabiegi</h2>
  <div class="grid" style="margin-top:10px">
    ${fieldHTML({k:'sh.age',label:'Wiek pacjenta',type:'num',unit:'lat',w:'s'})}
    <div class="f l"><label for="codeIn">Kody zabiegów (wpisz po przecinku i Enter)</label><div class="row"><input type="text" id="codeIn" placeholder="np. ST33, ST30, 1101, 1108" autocomplete="off" style="flex:1"><button type="button" class="btn sm" data-act="addcodes">Dodaj</button></div></div>
  </div>
  ${state.unknown.length?`<div class="warn">Brak w bazie: ${state.unknown.map(esc).join(', ')}. Dostępne kody są poniżej.</div>`:''}
  <div class="group"><h3>Wybrane (w tej kolejności powstanie opis)</h3><div class="sel-list">${sel||'<span class="note">Nic jeszcze nie wybrano.</span>'}</div></div>
  ${GROUPS.map(([g,cs])=>`<div class="group"><h3>${g}</h3><div class="chips">${cs.map(c=>`<button type="button" class="chip${has(c)?' on':''}" data-act="code" data-c="${c}" aria-pressed="${has(c)}">${c}<small>${esc(D[c].name)}</small></button>`).join('')}</div></div>`).join('')}
  </section>`;
}
function renderStep2(){return sharedCard()+state.codes.map(cardHTML).join('');}
function renderStep3(){
  const outs=buildOut();
  const rows=state.codes.map(c=>{const d=D[c];let where='—';
    if(d.diag&&d.diag.mode==='mixed'){const qs=(state.quads[c]||[]).slice().sort(),ts=teethOf(c);where=[qs.length?'ćwiartki '+qs.join(', '):'',ts.length?'zęby '+ts.join(', '):''].filter(Boolean).join('; ')||'—';}
    else if(d.diag){if(d.diag.mode==='quad')where=(state.quads[c]||[]).length?'ćwiartki '+(state.quads[c]||[]).slice().sort().join(', '):'—';else{const ts=teethOf(c);where=ts.length?ts.map(t=>{const s=surfOf(c,t);return t+(d.diag.mode==='surf'&&s.length?' '+SORD.filter(x=>s.includes(x)).join(''):'');}).join(', '):'—';}}
    return `<tr><td class="m">${c}</td><td>${esc(d.icd)}</td><td class="m">${esc(where)}</td></tr>`;}).join('');
  const m=missCount();
  const panel=pos=>`<div class="copyall"><p>${pos==='top'?'Cały opis wszystkich zabiegów jednym kliknięciem – wklejasz raz.':'Koniec opisu.'}${m?` <b style="color:var(--fill)">Uwaga: ${m} ${plural(m,'pole','pola','pól')} [UZUPEŁNIJ].</b>`:''}</p><button type="button" class="btn big" data-act="copyall">Kopiuj cały opis (${outs.length} ${plural(outs.length,'zabieg','zabiegi','zabiegów')})</button></div>`;
  return panel('top')+`<section class="card"><h2>Do diagramu i rozliczenia</h2><p class="note" style="margin:0 0 8px">Ściąga do wpisania w programie gabinetu – nie trafia do kopiowanego opisu.</p><div style="overflow-x:auto"><table class="sum"><thead><tr><th>Kod</th><th>ICD-10 wg pliku</th><th>Zaznaczone na diagramie</th></tr></thead><tbody>${rows}</tbody></table></div></section>`+
  outs.map((o,i)=>`<section class="card"><div class="out-head"><h2><span class="code">${o.code}</span>${esc(D[o.code].name)}</h2><button type="button" class="btn sm" data-act="copy" data-i="${i}">Kopiuj</button></div><div class="out" id="out-${i}">${htmlOut(o.text)}</div></section>`).join('')+
  `<section class="card"><div class="out-head"><h2>Cały opis – wszystkie zabiegi razem</h2><button type="button" class="btn sm" data-act="copyall">Kopiuj</button></div><div class="out all">${htmlOut(outs.map(o=>o.text).join('\n\n'))}</div></section>`+panel('bottom');
}
function render(){
  renderSteps();
  $('#main').innerHTML=state.step===1?renderStep1():state.step===2?renderStep2():renderStep3();
  renderBar();
}
function rerenderCard(code){
  if(state.step!==2){render();return;}
  const id=code==='shared'?'card-shared':'card-'+code; const el=document.getElementById(id);
  if(el){const tmp=document.createElement('div');tmp.innerHTML=code==='shared'?sharedCard():cardHTML(code);el.replaceWith(tmp.firstElementChild);}
  else render();
  renderBar();
}

/* ---------- zdarzenia ---------- */
function addCodes(txt){
  const toks=(txt.toUpperCase().match(/[A-Z]*\d+[A-Z]?/g)||[]);state.unknown=[];
  toks.forEach(t=>{if(D[t]){if(!has(t))state.codes.push(t);}else state.unknown.push(t);});
}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),1600);}
async function copyText(s){
  try{await navigator.clipboard.writeText(s);toast('Skopiowano');return;}catch(e){}
  const ta=$('#clip');ta.value=s;ta.select();try{document.execCommand('copy');toast('Skopiowano');}catch(e){toast('Nie udało się skopiować – zaznacz tekst ręcznie');}
}
function toggleTooth(code,t){
  const d=D[code];const o=state.teeth[code]=state.teeth[code]||{};
  if(d.diag.mode==='quad'){const q=qd(t);const qs=state.quads[code]=state.quads[code]||[];const i=qs.indexOf(q);i>=0?qs.splice(i,1):qs.push(q);return;}
  if(o[t])delete o[t];else o[t]={s:[],f:{}};
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;
  if(a==='step'){state.step=+el.dataset.n;render();window.scrollTo(0,0);return;}
  if(a==='code'){const c=el.dataset.c;has(c)?state.codes.splice(state.codes.indexOf(c),1):state.codes.push(c);render();return;}
  if(a==='rmcode'){state.codes.splice(state.codes.indexOf(el.dataset.c),1);render();return;}
  if(a==='addcodes'){addCodes($('#codeIn').value);render();return;}
  if(a==='seg'){const k=el.dataset.key;const cur=str(getVal(k));setVal(k,cur===el.dataset.v?'':el.dataset.v);afterChange(el);return;}
  if(a==='chk'){const k=el.dataset.key;let arr=getVal(k);arr=Array.isArray(arr)?arr.slice():[];const v=el.dataset.v;const i=arr.indexOf(v);i>=0?arr.splice(i,1):arr.push(v);setVal(k,arr);afterChange(el);return;}
  if(a==='brak'){setVal(el.dataset.key,'brak');afterChange(el);return;}
  if(a==='tooth'){if(e.target.closest('[data-act="surf"]'))return;toggleTooth(el.dataset.code,+el.dataset.t);rerenderCard(el.dataset.code);return;}
  if(a==='surf'){const c=el.dataset.code,t=+el.dataset.t,s=el.dataset.s;const d=D[c];
    if(d.diag.mode!=='surf'){toggleTooth(c,t);rerenderCard(c);return;}
    const o=state.teeth[c]=state.teeth[c]||{};o[t]=o[t]||{s:[],f:{}};const i=o[t].s.indexOf(s);i>=0?o[t].s.splice(i,1):o[t].s.push(s);rerenderCard(c);return;}
  if(a==='untooth'){delete (state.teeth[el.dataset.code]||{})[el.dataset.t];rerenderCard(el.dataset.code);return;}
  if(a==='quad'){const c=el.dataset.code,q=+el.dataset.q;const qs=state.quads[c]=state.quads[c]||[];const i=qs.indexOf(q);i>=0?qs.splice(i,1):qs.push(q);rerenderCard(c);return;}
  if(a==='quadset'){const c=el.dataset.code;state.quads[c]=el.dataset.q?el.dataset.q.split(',').map(Number):[];rerenderCard(c);return;}
  if(a==='addrow'){(state.a[el.dataset.key]=state.a[el.dataset.key]||[]).push({});rerenderCard(el.dataset.code);return;}
  if(a==='delrow'){const arr=state.a[el.dataset.key]||[];arr.splice(+el.dataset.i,1);if(!arr.length)arr.push({});rerenderCard('1206');return;}
  if(a==='copy'){const o=buildOut()[+el.dataset.i];copyText(plain(o.text));return;}
  if(a==='copyall'){copyText(buildOut().map(o=>plain(o.text)).join('\n\n'));return;}
  if(a==='reset'){if(!el.dataset.armed){el.dataset.armed='1';el.textContent='Kliknij ponownie, aby wyczyścić';setTimeout(()=>{if(el.isConnected){delete el.dataset.armed;el.textContent='Nowy pacjent';}},3000);return;}
    state.step=1;state.codes=[];state.a={};state.teeth={};state.quads={};state.unknown=[];initDefaults();render();window.scrollTo(0,0);return;}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='codeIn'){e.preventDefault();addCodes(e.target.value);render();setTimeout(()=>{const i=$('#codeIn');if(i)i.focus();},0);}
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('tooth')){e.preventDefault();e.target.click();}
});
function cardOf(el){const c=el.closest('section.card');if(!c)return null;return c.id==='card-shared'?'shared':c.id.replace('card-','');}
function afterChange(el){
  const card=cardOf(el);
  if(state.step===2){
    if(card==='shared'){rerenderCard('shared');state.codes.forEach(c=>{if(D[c].fields||D[c].perTooth)rerenderCard(c);});}
    else if(card)rerenderCard(card);
  } else render();
}
document.addEventListener('input',e=>{
  const k=e.target.dataset&&e.target.dataset.key;if(!k)return;
  setVal(k,e.target.value);
  e.target.classList.toggle('empty',!e.target.value.trim());
  const lab=e.target.closest('.f')&&e.target.closest('.f').querySelector('label .need');if(lab&&e.target.value.trim())lab.remove();
  renderBar();
});
document.addEventListener('change',e=>{
  const k=e.target.dataset&&e.target.dataset.key;if(!k)return;
  setVal(k,e.target.value);
  if(e.target.tagName==='SELECT'){afterChange(e.target);return;}
  if(k==='sh.age'&&state.step===2){afterChange(e.target);}
});
render();
</script>
</body>
</html>
