<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generator opisów NFZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Plan: narzędzie gabinetowe — stepper u góry, karty zabiegów, odontogram FDI, gotowy tekst do skopiowania. */
:root{
  --bg:#f2f5f5; --surface:#ffffff; --ink:#15262a; --muted:#5a6b70; --line:#d3dddf;
  --accent:#0b6a70; --accent-soft:#dbeeed; --accent-ink:#ffffff;
  --fill:#c62828; --fill-soft:#fde7e5; --warn:#9a5b00; --warn-soft:#fff3dc; --ok:#2e7d4f;
  --font-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1618; --surface:#162124; --ink:#e2ebeb; --muted:#93a6a9; --line:#2a3b3e;
    --accent:#4db6b2; --accent-soft:#15393a; --accent-ink:#06191a;
    --fill:#ff8a80; --fill-soft:#3b1e1d; --warn:#f2b35c; --warn-soft:#33270f; --ok:#6fcf97;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1618; --surface:#162124; --ink:#e2ebeb; --muted:#93a6a9; --line:#2a3b3e;
  --accent:#4db6b2; --accent-soft:#15393a; --accent-ink:#06191a;
  --fill:#ff8a80; --fill-soft:#3b1e1d; --warn:#f2b35c; --warn-soft:#33270f; --ok:#6fcf97;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45}
.wrap{max-width:1080px;margin:0 auto;padding:16px 16px 120px}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
h1 small{display:block;font-size:13px;font-weight:400;color:var(--muted)}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps button{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
.steps button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.steps button:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h2{margin:0 0 4px;font-size:17px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.code{font-family:var(--font-mono);font-weight:600;background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:6px;font-size:14px}
.icd{font-family:var(--font-mono);font-size:12.5px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.tips{margin:6px 0 10px;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.tips li{font-size:12.5px;color:var(--muted);background:var(--bg);border-radius:6px;padding:3px 8px}
.warn{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:7px 10px;font-size:13.5px;margin:8px 0}
.grid{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end}
.f{display:flex;flex-direction:column;gap:4px;min-width:140px}
.f.s{min-width:90px;max-width:120px}.f.m{min-width:170px;max-width:240px}.f.l{flex:1 1 320px}.f.full{flex:1 1 100%}
.f>label,.f>.lab{font-size:12.5px;font-weight:600;color:var(--muted)}
.lab .need{color:var(--fill);font-weight:600}
input[type=text],input[type=date],select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%}
input[type=text].empty,select.empty{border-color:var(--fill);background:var(--fill-soft)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.unit{display:flex;align-items:center;gap:6px}.unit span{color:var(--muted);font-size:13px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:inherit;font-size:13.5px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;padding:6px 10px;cursor:pointer}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg.empty button{border-color:var(--fill)}
.btn{font:inherit;font-weight:600;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:9px 16px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{padding:5px 10px;font-size:13px;font-weight:500}
.mini{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:6px;padding:2px 8px;min-height:24px;cursor:pointer}   /* min. 24 px – wygodne dotknięcie na telefonie (WCAG 2.5.8) */
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-family:var(--font-mono);font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;padding:5px 9px;cursor:pointer;text-align:left}
.chip small{font-family:var(--font-body);color:var(--muted);margin-left:6px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.chip.on small{color:var(--accent-ink);opacity:.85}
.group{margin-top:12px}.group h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 2px}
.sel-list{display:flex;flex-wrap:wrap;gap:6px;min-height:34px;align-items:center}
.sel-list .code{display:inline-flex;align-items:center;gap:6px}
.sel-list .code button{border:0;background:transparent;color:inherit;cursor:pointer;font-size:15px;line-height:1;padding:0;min-width:24px;min-height:24px;margin:-3px -7px -3px -3px;border-radius:4px}
.note{font-size:13px;color:var(--muted)}
/* odontogram */
.odo{overflow-x:auto;margin:10px 0 4px;padding-bottom:4px}
.odo-in{display:inline-flex;flex-direction:column;gap:2px;min-width:max-content}
.odo-row{display:flex;justify-content:center;gap:2px}
.odo-row.prim{opacity:.95}
.odo-sep{width:10px;border-left:2px solid var(--line);margin:0 4px}
.odo-mid{height:1px;background:var(--line);margin:4px 0}
.tooth{display:flex;flex-direction:column;align-items:center;gap:1px;padding:2px;border-radius:6px;cursor:pointer;border:1px solid transparent;position:relative}
.tooth .n{font-family:var(--font-mono);font-size:11.5px;color:var(--muted);line-height:1}
.tooth svg{display:block}
.tooth svg polygon,.tooth svg rect{fill:var(--surface);stroke:var(--muted);stroke-width:1}
.tooth.prim svg polygon,.tooth.prim svg rect{stroke-dasharray:2 1.5}
.tooth.inq{background:var(--accent-soft)}
.tooth.sel{background:var(--accent-soft);border-color:var(--accent)}
.tooth.sel .n{color:var(--accent);font-weight:600}
.tooth.sel::after{content:"✓";position:absolute;top:-6px;right:-4px;background:var(--accent);color:var(--accent-ink);border-radius:50%;width:15px;height:15px;font-size:10px;display:flex;align-items:center;justify-content:center}
.tooth svg .on{fill:var(--accent)!important}
.odo.surf .tooth svg polygon:hover,.odo.surf .tooth svg rect:hover{fill:var(--accent-soft)}
.quadbar{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.legend{font-size:12px;color:var(--muted);margin-top:4px}
.tooth-panel{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:10px}
.tooth-panel h4{margin:0 0 8px;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tnum{font-family:var(--font-mono);background:var(--accent);color:var(--accent-ink);border-radius:5px;padding:1px 7px}
.sub{border-top:1px dashed var(--line);margin-top:12px;padding-top:10px}
.sub h4{margin:0 0 8px;font-size:14px}
.sites{display:grid;grid-template-columns:auto repeat(6,minmax(44px,60px));gap:4px 6px;align-items:center;font-size:12.5px}
.sites input{padding:5px;text-align:center}
.sites .h{color:var(--muted);text-align:center;font-family:var(--font-mono)}
/* output */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px;z-index:5}
.bar .in{max-width:1080px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.miss{font-size:14px}.miss b{color:var(--fill)}.miss.okk b{color:var(--ok)}
.out{white-space:pre-wrap;font-family:var(--font-body);font-size:14px;line-height:1.5;background:var(--bg);border-radius:8px;padding:12px;margin:10px 0 0;max-height:520px;overflow:auto;border:1px solid var(--line)}
.out mark{background:var(--fill-soft);color:var(--fill);font-weight:600;border-radius:4px;padding:0 3px}
.out-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
table.sum{border-collapse:collapse;width:100%;font-size:13.5px}
table.sum th,table.sum td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.sum th{color:var(--muted);font-weight:600;font-size:12.5px}
table.sum td.m{font-family:var(--font-mono)}
.err{background:var(--fill-soft);color:var(--fill);border:1px solid var(--fill);border-radius:8px;padding:8px 10px;font-size:13.5px;margin:8px 0}
.nfz{margin:0 0 14px}.nfz .err,.nfz .warn{margin:6px 0}
.nfz-src{font-size:12px;color:var(--muted);margin-top:4px}
.mintime{font-family:var(--font-mono);font-size:12.5px;border-radius:6px;padding:1px 7px;background:var(--warn-soft);color:var(--warn)}
.mintime.bad{background:var(--fill-soft);color:var(--fill)}
.pts{font-family:var(--font-mono);font-size:12.5px;border-radius:6px;padding:1px 7px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chip .pts{margin-left:6px;padding:0 5px;font-size:11.5px}
.chip.on .pts{background:transparent;color:var(--accent-ink);box-shadow:inset 0 0 0 1px currentColor}
.pts-total{font-family:var(--font-mono);font-size:15px;font-weight:600;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent);border-radius:8px;padding:8px 12px;white-space:nowrap}
.out-head .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
a.pts-total{text-decoration:none}a.pts-total:hover{background:var(--accent);color:var(--accent-ink)}
.pts-total{white-space:normal;line-height:1.35}
.money{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1fr) minmax(0,1.2fr);gap:10px;margin-top:12px}
.mbox{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.mbox.hl{border-color:var(--accent);background:var(--accent-soft)}
.mbox .lab{font-size:12.5px;font-weight:600;color:var(--muted)}
.mbox .mval{font-family:var(--font-mono);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.mbox .unit input{max-width:90px}
.mbox .mrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
@media (max-width:760px){.money{grid-template-columns:1fr}}
.save-row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;border:1px dashed var(--line);border-radius:8px;padding:10px 12px;margin:10px 0 0}
.save-st{font-size:13.5px;flex:1 1 240px;align-self:center}
.save-ok{color:var(--ok);font-weight:600}.save-bad{color:var(--fill);font-weight:600}.save-none{color:var(--muted)}
.hist h2{gap:8px}.hist .hdate{font-family:var(--font-mono);font-size:14px;font-weight:600}
.hist .hcodes{font-family:var(--font-mono);font-size:12.5px;color:var(--muted);font-weight:400}
.hist .row{margin-top:10px}
.steps button.hist-tab{border-style:dashed}
table.sum td.r,table.sum th.r{text-align:right;white-space:nowrap}
table.sum tfoot td{border-bottom:0;border-top:2px solid var(--ink);font-weight:700;font-size:14.5px}
table.sum .sub-n{display:block;font-family:var(--font-body);font-size:12px;color:var(--warn);margin-top:2px}
.plans{border:1px solid var(--accent);background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;margin:12px 0 4px}
.plans-h{margin:0 0 8px;font-size:15px}
.plan-row{display:grid;grid-template-columns:190px minmax(0,1fr);gap:8px 12px;align-items:center;padding:8px 0}
.plan-row+.plan-row{border-top:1px dashed var(--line)}
.plan-row.dim{opacity:.55}
.plan-lab{font-weight:600;font-size:14px}
.plan-btns{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.plan-btn{font:inherit;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:3px;width:100%;min-width:0;height:100%;min-height:72px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left}
.plan-btn b{font-size:14px}.plan-btn .pc{display:flex;flex-wrap:wrap;gap:2px 10px;font-family:var(--font-mono);font-size:12px;color:var(--muted);line-height:1.35}.plan-btn .pc i{font-style:normal;white-space:nowrap}
.plan-btn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.plan-btn.on .pc{color:var(--accent-ink);opacity:.9}
@media (max-width:760px){.plan-row{grid-template-columns:1fr}.plan-btns{grid-template-columns:repeat(2,minmax(0,1fr))}}
.copyall{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
.copyall p{margin:0;font-size:14px}
.crow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:5px 0;border-bottom:1px solid var(--line)}.crow .cn{flex:1 1 140px;min-width:0;font-size:14px;overflow-wrap:anywhere}.crow.hid{opacity:.55}
#segQ{min-height:40px;box-sizing:border-box;padding:8px 10px;font:inherit;border:1px solid var(--line);border-radius:8px}
.mini.star{color:var(--line);font-size:16px}.mini.star[aria-pressed="true"]{color:#e0a100;border-color:#e0a100}
.zrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}.zrow input{flex:1;min-width:160px}
.plan-btns.sets{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.edtxt{width:100%;min-height:340px;font:inherit;font-size:14.5px;line-height:1.5;padding:12px;border:1px solid var(--line);border-radius:var(--r);box-sizing:border-box;resize:vertical}
.btn.big{font-size:16px;padding:12px 22px}
.out.all{max-height:440px}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
.hidden{display:none!important}
@media (max-width:520px){.f{min-width:120px}.card{padding:12px}}

/* ===== ewidencja wizyt, statystyki, ustawienia ===== */
/* kolory serii na wykresach – sprawdzone walidatorem palety na jasnym (#ffffff) i ciemnym (#162124) tle kart; kolor idzie za źródłem przychodu */
:root{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--s1:#3987e5;--s2:#d95926;--s3:#199e70}}
:root[data-theme="dark"]{--s1:#3987e5;--s2:#d95926;--s3:#199e70}
.s-pe{--sc:var(--s1)}.s-rv{--sc:var(--s2)}.s-ex{--sc:var(--s3)}
.steps button.sep{margin-left:10px}
.switch{font:inherit;font-size:13.5px;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px 5px 6px;cursor:pointer;text-align:left}
.switch .knob{width:34px;height:20px;border-radius:999px;background:var(--muted);opacity:.55;position:relative;flex:0 0 auto;transition:background .15s,opacity .15s}
.switch .knob::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .15s}
.switch.on{border-color:var(--accent)}.switch.on .knob{background:var(--accent);opacity:1}.switch.on .knob::after{transform:translateX(14px)}
@media (prefers-reduced-motion: reduce){.switch .knob,.switch .knob::after{transition:none}}
.f.sw{min-width:0;align-items:flex-start}
.link-ban{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:10px 14px;margin-bottom:14px;font-size:14px}
.save-st .btn{margin:4px 4px 0 0}
.settle{border-top:1px dashed var(--line);margin-top:14px;padding-top:12px}
.settle h3,.struct h3{margin:0 0 10px;font-size:15px}
.exrows{display:flex;flex-direction:column;gap:6px;align-items:flex-start;width:100%}
.exrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;width:100%}
.exrow .unit input{width:110px}.exrow>input{flex:1 1 220px;min-width:0}
.sumline{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;margin-top:10px;font-size:14px;color:var(--muted)}
.sumline b{color:var(--ink);font-weight:600}.sumline .tot{font-family:var(--font-mono);font-size:17px;font-weight:600;color:var(--ink)}
.eform .unit input{min-width:0}
/* historia */
.dayh{display:flex;align-items:baseline;justify-content:space-between;gap:6px 12px;flex-wrap:wrap;margin:20px 2px 8px}
.dayh h3{margin:0;font-size:15px}.dayh h3::first-letter{text-transform:uppercase}
.dayh .dsum{font-size:13px;color:var(--muted)}.dayh .dsum b{color:var(--ink)}
.hist{padding:12px 16px;margin-bottom:8px}.hist.cur,.hist.editing{border-color:var(--accent)}
.hist .hno{font-family:var(--font-mono);font-size:12.5px;color:var(--muted);font-weight:400}
.tnum.anon{background:var(--muted)}
.etot{font-family:var(--font-mono);font-size:16px;font-weight:600;white-space:nowrap}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
.chiprow .pts{white-space:normal;display:inline-flex;align-items:center}
.pts.plain{background:var(--bg);color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;background:var(--sc);flex:0 0 auto}
.warn.bk{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
/* statystyki */
.filt .chip{font-family:var(--font-body)}
.hero{display:flex;flex-direction:column;gap:2px;margin-bottom:12px}
.hero .hv{font-size:clamp(34px,9vw,48px);font-weight:600;line-height:1.1;letter-spacing:-.01em}
.tl{font-size:12.5px;font-weight:600;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .tv{font-size:19px;font-weight:600}.tile .ts{font-size:12.5px;color:var(--muted)}
@media (max-width:860px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.struct{margin-top:16px}
.segbar{display:flex;gap:2px;height:28px;margin:8px 0}
.sb{min-width:0;border-radius:4px;display:flex;align-items:center;padding:0 8px;background:var(--sc);color:#fff;font-size:12.5px;font-weight:600;white-space:nowrap}
.sb:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.legend2{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--muted);margin:6px 0}
.legend2 .lg{display:inline-flex;align-items:center;gap:6px}.legend2 b{color:var(--ink);font-weight:600}
.lgs{width:12px;height:12px;border-radius:3px;display:inline-block;background:var(--sc);flex:0 0 auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:5px 14px;cursor:pointer}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.chart{margin:8px 0 4px}.chart figcaption{font-weight:600;font-size:14px;margin-bottom:4px}
.ch-row{display:flex;align-items:flex-start}.ch-axis{flex:0 0 auto}
.ch-scroll{overflow-x:auto;flex:1 1 auto;min-width:0}.ch-scroll svg{display:block;min-width:100%}
.ch-axis text,.chart .xl{font-family:var(--font-body);font-size:11.5px;fill:var(--muted);font-variant-numeric:tabular-nums}
.chart .x2{font-size:10.5px}
.chart .cap{font-family:var(--font-body);font-size:11.5px;font-weight:600;fill:var(--ink)}
.gl{stroke:var(--line);stroke-width:1}.bl{stroke:var(--muted);stroke-width:1;opacity:.55}
.cseg{fill:var(--sc)}
.band{outline:none}.band .hit{fill:transparent}
.band:hover .hit,.band:focus .hit{fill:var(--bg)}
.band:focus-visible .hit{stroke:var(--accent);stroke-width:2}
.band:hover .cseg,.band:focus .cseg{filter:brightness(1.12)}
.tip{position:fixed;z-index:20;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.16);max-width:290px;left:0;top:0}
.tip[hidden]{display:none}
.tip-t{font-weight:600;margin-bottom:4px}.tip-t::first-letter{text-transform:uppercase}
.tip-r{display:flex;align-items:center;gap:6px;line-height:1.5}.tip-r b{font-weight:600;font-variant-numeric:tabular-nums}.tip-r span{color:var(--muted)}
.tkey{width:10px;height:3px;border-radius:2px;display:inline-block;background:var(--sc);flex:0 0 auto}
.tip-f{margin-top:4px;padding-top:4px;border-top:1px solid var(--line);color:var(--muted)}
.tblw{overflow-x:auto;margin-top:10px;
  background:linear-gradient(to left,var(--surface) 40%,transparent) right/28px 100% no-repeat local,
    radial-gradient(farthest-side at 100% 50%,color-mix(in srgb,var(--ink) 22%,transparent),transparent) right/12px 100% no-repeat scroll}   /* cień po prawej = tabela ma dalsze kolumny (znika po przewinięciu do końca) */
table.stat th:first-child,table.stat td:first-child{position:sticky;left:0;z-index:1;background:var(--surface);box-shadow:inset -1px 0 0 var(--line)}
table.stat{white-space:nowrap;font-variant-numeric:tabular-nums}
table.stat td::first-letter{text-transform:none}
.lead{margin:0 0 6px;font-size:14px}.subh{font-size:14px;margin:20px 0 0}
/* ustawienia */
.setrow{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:8px 16px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.setrow:first-of-type{border-top:0}
.setlab{font-weight:600;font-size:14px;display:flex;flex-direction:column;gap:2px}.setlab .note{font-weight:400}
@media (max-width:700px){.setrow{grid-template-columns:1fr}}

<script src="wspolne.js?v=1"></script>
<script src="szablony.js?v=2026-11-15-10"></script>
<script>
/* ---------- użytkownik i jego przestrzeń danych (wspolne.js) ----------
   Dane każdego użytkownika są w osobnej bazie (opisyNFZ@<id>) i są szyfrowane jego kluczem; sesję i klucz sprawdza dbInit (G.ready). */
const UID=G.hint()||'-';
if(!G.hint())G.goLogin('nfz');
const LSP='opisyNFZ@'+UID+'.';
G.bar('nfz');

/* ---------- stan ---------- */
const state = { step:1, codes:[], a:{}, teeth:{}, quads:{}, unknown:[], plan:null, back:1,
  savedId:null, savedNo:null, savedCreated:null, savedSig:null, pendSig:null, saveInfo:null, skipSave:false, iniOk:null, diffOk:null, link:null, loadedTxt:null, ed:null,
  vPrice:null, vPct:null, vRev:null };
function initDefaults(){ state.a['ST30.czas']='21'; state.a['ST30G.czas']='21'; state.a['ST30E.czas']='11'; state.a['ST01.wer']='nowy'; state.a['ST02.wer']='nowy'; state.a['1206.canals']=[{}]; }
initDefaults();

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MISS=l=>'\u0001'+l+'\u0002';
function getVal(key){
  if(key.startsWith('T|')){const [,c,t,f]=key.split('|');return ((state.teeth[c]||{})[t]||{f:{}}).f[f];}
  if(key.startsWith('R|')){const [,lk,i,f]=key.split('|');return ((state.a[lk]||[])[+i]||{})[f];}
  return state.a[key];
}
function setVal(key,v){
  if(key.startsWith('T|')){const [,c,t,f]=key.split('|');const o=((state.teeth[c]=state.teeth[c]||{})[t]=state.teeth[c][t]||{s:[],f:{}});o.f[f]=v;return;}
  if(key.startsWith('R|')){const [,lk,i,f]=key.split('|');const arr=state.a[lk]=state.a[lk]||[];arr[+i]=arr[+i]||{};arr[+i][f]=v;return;}
  state.a[key]=v;
}
const str=v=>(v===undefined||v===null)?'':(Array.isArray(v)?v:String(v).trim());
function V(key,label){const v=str(getVal(key));return (Array.isArray(v)?v.length:v)?v:MISS(label);}
function AGE(){const v=parseFloat(String(state.a['sh.age']||'').replace(',','.'));return isNaN(v)?null:v;}
function num(v){return String(v).replace('.',',');}
const has=c=>state.codes.includes(c);
function plural(n,a,b,c){if(n===1)return a;const d=n%10,dd=n%100;return (d>=2&&d<=4&&!(dd>=12&&dd<=14))?b:c;}

/* zęby */
const qd=t=>{const d=Math.floor(t/10);return d<5?d:d-4;};
const isPrim=t=>Math.floor(t/10)>=5;
const isUpper=t=>[1,2,5,6].includes(Math.floor(t/10));
const isAnt=t=>t%10<=3;
const viewLeft=t=>[1,4,5,8].includes(Math.floor(t/10));
function layout(t){
  const vest=isAnt(t)?'W':'B', oral=isUpper(t)?'P':'L', c=isAnt(t)?'I':'O';
  const mr=viewLeft(t);
  return {top:isUpper(t)?vest:oral,bottom:isUpper(t)?oral:vest,left:mr?'D':'M',right:mr?'M':'D',center:c};
}
const SORD=['M','O','I','D','B','W','P','L'];
const STEM={M:'mezjaln',O:'żując',I:'sieczn',D:'dystaln',B:'policzkow',W:'wargow',P:'podniebienn',L:'językow'};
const SNAME={M:'mezjalna',O:'żująca',I:'sieczna',D:'dystalna',B:'policzkowa',W:'wargowa',P:'podniebienna',L:'językowa'};
function surfText(arr){
  const s=SORD.filter(x=>(arr||[]).includes(x)); if(!s.length) return '';
  return s.map((x,i)=>STEM[x]+(i<s.length-1?'o':'ej')).join('-')+' ('+s.join('')+')';
}
function teethOf(code){const o=state.teeth[code]||{};return Object.keys(o).map(Number).sort(sortFDI);}
function sortFDI(a,b){const qa=qd(a),qb=qd(b);if(qa!==qb)return qa-qb;if(isPrim(a)!==isPrim(b))return isPrim(a)?1:-1;return a-b;}
function teethTxt(code,label){const t=teethOf(code);return t.length?t.join(', '):MISS(label||'zęby (diagram)');}
function tv(code,t,f,label){return V('T|'+code+'|'+t+'|'+f,label+' – ząb '+t);}

/* ---------- pola ---------- */
const WEDZ=['Typ I – śluzówkowy','Typ II – dziąsłowy','Typ III – brodawkowy','Typ IV – przezbrodawkowy'];
function examFields(){return [
  {k:'sh.api',label:'API',type:'num',unit:'%',w:'s'},
  {k:'sh.gi',label:'GI (Löe–Silness)',type:'num',w:'s'},
  {k:'sh.wg',label:'Wędzidełko wargi górnej',type:'select',opts:WEDZ},
  {k:'sh.wd',label:'Wędzidełko wargi dolnej',type:'select',opts:WEDZ},
  {k:'sh.al',label:'Alergie',type:'brak'},
  {k:'sh.ch',label:'Choroby ogólnoustrojowe',type:'brak'},
  {k:'sh.lk',label:'Przyjmowane leki na stałe',type:'brak'}];}
function matFields(p,code){
  const m=str(getVal(p+'mat'));
  const f=[{k:p+'mat',label:'Materiał',type:'seg',opts:['kompozyt','glassjonomer RIVA LC'],rer:code}];
  if(m==='kompozyt') f.push({k:p+'name',label:'Nazwa kompozytu',type:'text'});
  f.push({k:p+'color',label:'Kolor',type:'text',w:'s'});
  return f;
}
function matText(p,style){
  const m=str(getVal(p+'mat'));
  if(!m) return MISS('materiał');
  if(m==='kompozyt') return (style==='docx'?'kompozytowy ':'kompozyt ')+V(p+'name','nazwa kompozytu')+', kolor '+V(p+'color','kolor');
  return (style==='docx'?'glassjonomerowy':'glassjonomer')+' RIVA LC, kolor '+V(p+'color','kolor');
}
function surfOf(code,t){return ((state.teeth[code]||{})[t]||{s:[]}).s;}
function surfTxt(code,t){const s=surfText(surfOf(code,t));return s||MISS('powierzchnie – ząb '+t+' (kliknij na diagramie)');}

/* ---------- wspólne fragmenty ---------- */
function apiLine(){const v=str(state.a['sh.api']);return 'Wskaźnik obecności płytki nazębnej - wskaźnik API =  '+(v?num(v).replace('%','')+'%':MISS('API %'));}
function giLine(){
  const g=str(state.a['sh.gi']); if(!g) return 'Wskaźnik stanu dziąseł – GI - '+MISS('GI');
  const n=parseFloat(g.replace(',','.')); let it='Umiarkowane zapalenie dziąseł';
  if(!isNaN(n)) it = n===0?'Brak zapalenia dziąseł':n<=1?'Łagodne zapalenie dziąseł':n<=2?'Umiarkowane zapalenie dziąseł':'Ciężkie zapalenie dziąseł';
  return 'Wskaźnik stanu dziąseł – GI - '+it+'  '+num(g);
}
function examMid(){return [apiLine(),giLine(),
  'Wędzidełko warg górnej : '+V('sh.wg','wędzidełko górne'),
  'Wędzidełko warg dolnej: '+V('sh.wd','wędzidełko dolne'),
  'Wywiad:','Alergie – '+V('sh.al','alergie'),'Choroby ogólnoustrojowe – '+V('sh.ch','choroby ogólne'),'Przyjmowane leki na stałe – '+V('sh.lk','leki')].join('\n');}
function ageGroup(){const a=AGE();if(a===null)return null;return a<4?'1–3':a<7?'4–6':a<11?'7–10':'≥11';}
function instr(){
  const g=ageGroup(); if(!g) return MISS('wiek pacjenta (wybór instruktażu)');
  const p=[];
  if(g==='1–3')p.push(SEG.AGE_1_3); else if(g==='4–6')p.push(SEG.AGE_4_6); else if(g==='7–10')p.push(SEG.AGE_7_10);
  else{p.push(SEG.AGE_11);const m=state.a['sh.meth']||[];if(!m.length)p.push(MISS('metoda szczotkowania (Roll / Bass / Stillman)'));
    if(m.includes('Roll'))p.push(SEG.AGE_11_ROLL);if(m.includes('Bass'))p.push(SEG.AGE_11_BASS);if(m.includes('Stillman'))p.push(SEG.AGE_11_STILL);}
  if(state.a['sh.ortho']==='tak')p.push(SEG.ORTHO);
  return p.join('\n');
}
function byAge(key,fn){const v=str(state.a[key]);if(v)return v;const a=AGE();return a===null?'':fn(a);}

/* ---------- definicje kodów ---------- */
const TITLE_1105='Kod 1105 (postępowanie przy obnażeniu i skaleczeniu miazgi – bezpośrednie pokrycie miazgi)';
const EXT_REASONS=['znacznie zniszczony, odłamanie fragmentu zęba - nienadający się już do odbudowy','złamanie poddziąsłowe korony zęba','resorpcja fizjologiczna','wskazania ortodontyczne','widoczna przetoka przy ww. zębie, brak reakcji na chlorek etylu - ząb martwy','ropień podśluzówkowy - znaczne zniszczenie tkanek - ząb nienadający się do odbudowy','nieodwracalne zapalenie miazgi, samoistny, ciągły  ból zęba, reakcja na chlorek etylu wzmożona'];
const EXT_ANEST=['przewodowe Dentocaine (40mg + 0,005mg)/ml 1 amp','miejscowe nasiękowe Dentocaine (40mg + 0,005mg)/ml 1 amp','miejscowe  powierzchniowe Mark3 20% benzokaina'];
const PREP3=['Dentosept A Mini spray (do 4 r.ż )','Elgydium Clinic Cicalium (od 4 r.ż)','Curasept żel z chlorheksydyną 0,5% CHX  (od 7 r.ż)'];
const prepByAge=a=>a<4?PREP3[0]:a<7?PREP3[1]:PREP3[2];
const prep2ByAge=a=>a<4?PREP3[0]:PREP3[1];

function fillCode(code,cfg){return {
  name:cfg.name,icd:()=>{const a=AGE();return a!==null&&a<5?'K02 / K04 (wg rozpoznania)':'K02 / K04 / K05 (wg rozpoznania)';},tips:cfg.tips,
  diag:{mode:'surf',label:'Zaznacz ząb i kliknij leczone powierzchnie'},
  perTooth:t=>{const p='T|'+code+'|'+t+'|';const f=[];if(cfg.depth)f.push({k:p+'depth',label:'Próchnica',type:'seg',opts:['średnia','głęboka'],rer:code});return f.concat(matFields(p,code));},
  warn:()=>{const w=[];teethOf(code).forEach(t=>{
      if(cfg.prim===true&&!isPrim(t))w.push('Ząb '+t+' jest stały – kod 1108 dotyczy zębów mlecznych.');
      if(cfg.prim===false&&isPrim(t))w.push('Ząb '+t+' jest mleczny – dla zębów mlecznych zwykle 1108.');
      const n=surfOf(code,t).length; if(cfg.surf&&n&&!cfg.surf(n))w.push('Ząb '+t+': zaznaczono '+n+' pow. – '+cfg.surfMsg);});return w;},
  render:()=>{const ts=teethOf(code);const out=[cfg.title];if(!ts.length)out.push(MISS('ząb (diagram)'));
    ts.forEach(t=>out.push(cfg.body(t)));return out.join('\n');}
};}
function body15(code,big){return t=>{const p='T|'+code+'|'+t+'|';const d=str(getVal(p+'depth'));const u=big?'rozległego ubytku':'ubytku';
  if(!d) return 'Ząb '+t+', próchnica '+MISS('średnia / głęboka – ząb '+t);
  if(d==='średnia') return 'Ząb '+t+', próchnica średnia, ubytek na powierzchni '+surfTxt(code,t)+'.\nCałkowite opracowanie i odbudowa '+u+'. Założono materiał:\n'+matText(p,'user');
  return 'Ząb '+t+', próchnica głęboka, ubytek na powierzchni '+surfTxt(code,t)+'.\nCałkowite opracowanie i odbudowa '+u+'. Założono materiał podkładowy Ionosit oraz materiał'+(big?':':'')+'\n'+matText(p,'user');};}

const D={
 ST33:{name:'Badanie lekarskie z instruktażem higieny',icd:'Z01.2 Badanie dentystyczne',tips:['1× w roku kalendarzowym','dokładny diagram','na diagramie: nie zaznaczamy'],exam:true,instr:true,
   render:()=>['BADANIE LEKARSKIE STOMATOLOGICZNE, KTÓRE OBEJMUJE RÓWNIEŻ INSTRUKTAŻ HIGIENY JAMY USTNEJ (ST33)',SEG.EXAM_A,examMid(),SEG.EXAM_B,SEG.ZAL,SEG.INSTR_HEAD,instr()].join('\n')},
 ST34:{name:'Badanie lekarskie kontrolne',icd:'Z01.2 (lub K03.6)',tips:['co 4 mies. i 1 dzień','na diagramie: nie zaznaczamy'],exam:true,
   render:()=>['BADANIE LEKARSKIE KONTROLNE (ST34)',SEG.EXAM_A,examMid(),SEG.EXAM_B,SEG.ZAL].join('\n')},
 ST28:{name:'Badanie i kontrola po urazie zęba',icd:'Z01.2 + S02.5 Złamanie zęba',tips:['w kolejnych 6 mies. możliwe kontrole: 3× ST34 z badaniem żywotności','dodaj osobno kod leczenia (wypełnienie / ekstyrpacja / ekstrakcja)'],exam:true,
   diag:{mode:'teeth',label:'Zaznacz ząb po urazie i zęby sąsiednie badane chlorkiem etylu'},
   perTooth:t=>{const p='T|ST28|'+t+'|';return [{k:p+'role',label:'Ząb',type:'seg',opts:['po urazie','sąsiedni'],rer:'ST28'},{k:p+'re',label:'Reakcja na chlorek etylu',type:'seg',opts:['prawidłowa','wzmożona','brak reakcji miazgi'],rer:'ST28'}];},
   fields:()=>[{k:'ST28.cause',label:'Przyczyna urazu',type:'seg',opts:['upadek','uderzenie','upadek i nagryzienie na twardy przedmiot'],rer:'ST28'},
      {k:'ST28.days',label:'Ile dni temu',type:'num',w:'s'}],
   fields2:()=>{const f=[{k:'ST28.tx',label:'Rodzaj leczenia',type:'seg',opts:['brak (tylko badanie)','ząb z wypełnieniem – obnażenie miazgi','ząb z próchnicą – odbudowa','ekstyrpacja / endodoncja','ekstrakcja'],rer:'ST28',full:true}];
      const tx=str(state.a['ST28.tx']);
      if(tx&&!tx.startsWith('brak')) f.push({k:'ST28.lt',label:'Ząb leczony',type:'text',w:'s',ph:injured().join(', ')});
      if(tx.startsWith('ząb z')){f.push({k:'ST28.ls',label:'Powierzchnie',type:'checks',opts:SORD.map(s=>({v:s,l:s+' – '+SNAME[s]})),rer:'ST28',full:true});f.push(...matFields('ST28.',"ST28"));}
      if(tx.startsWith('ekstyrpacja'))f.push({k:'ST28.endo',label:'Decyzja',type:'seg',opts:['ekstyrpacji','leczeniu endodontycznym'],rer:'ST28'});
      return f;},
   warn:()=>{const w=[];const tx=str(state.a['ST28.tx']);if(tx.startsWith('ząb z'))w.push('Pamiętaj o dodaniu kodu wypełnienia ostatecznego.');if(tx.startsWith('ekstyrpacja'))w.push('Dodaj kod ekstyrpacji / leczenia endodontycznego i kod wypełnienia.');if(tx==='ekstrakcja')w.push('Dodaj kod ekstrakcji (ST01 / ST02).');return w;},
   render:()=>{
     const inj=injured(), all=teethOf('ST28');
     const o=['BADANIE LEKARSKIE STOMATOLOGICZNE I KONTROLNE PO URAZIE ZĘBA (ST28)',SEG.EXAM_A,examMid(),SEG.EXAM_B,SEG.ZAL,SEG.ST28_INSTR,'BADANIE W ZWIĄZKU Z URAZEM:'];
     o.push('Badanie po urazie zęba '+(inj.length?inj.join(', '):MISS('ząb po urazie (diagram)'))+' ('+V('ST28.cause','przyczyna urazu')+')  '+V('ST28.days','liczba dni')+' dni temu. Badanie żywotności chlorkiem etylu zębów:');
     const ord=inj.concat(all.filter(t=>!inj.includes(t)));
     if(!ord.length)o.push(MISS('zęby badane (diagram)'));
     ord.forEach((t,i)=>{o.push((i+1)+') '+(inj.includes(t)?'ząb po urazie':'ząb sąsiedni')+' nr '+t+' -reakcja '+tv('ST28',t,'re','reakcja'));});
     const tx=str(state.a['ST28.tx']); if(!tx){o.push(MISS('leczenie w związku z urazem'));return o.join('\n');}
     if(tx.startsWith('brak'))return o.join('\n');
     o.push('LECZENIE W ZWIĄZKU Z URAZEM:');
     const T=str(state.a['ST28.lt'])||(inj.length?inj.join(', '):MISS('ząb leczony'));
     const S=surfText(state.a['ST28.ls']||[])||MISS('powierzchnie');
     if(tx.startsWith('ząb z wyp'))o.push('W wyniku urazu nastąpiło odłamanie fragmentu zęba, który uległ urazowi wraz z fragmentem wypełnienia w tym samym zębie. Pod wypełnieniem była próchnica wtórna.\nCałkowite opracowanie rozległego, głębokiego ubytku zęba '+T+' na powierzchni '+S+'. Podczas mechanicznego opracowania próchnicy nastąpiło obnażenie próchnicowe miazgi na bardzo małym fragmencie powierzchni. Pacjent nie podaje aby miał dolegliwości bólowe ze strony zęba. Przepłukano ubytek NaCl, założono Ca (OH)2 nietwardniejący Biopulp , potem twardniejący Ca (OH)2  Life, podkład Ionosit oraz materiał:\n'+matText('ST28.','docx')+'\nZalecana kontrola po 8 tygodniach, następnie 3,6,12,18 mc, w razie dolegliwości bólowych kontrola w gabinecie stomatologicznym.');
     else if(tx.startsWith('ząb z pr'))o.push('W wyniku urazu nastąpiło odłamanie fragmentu zęba. Konieczność wykonania odbudowy zęba. Ząb '+T+', próchnica głęboka, ubytek na powierzchni '+S+'. Całkowite opracowanie i odbudowa ubytku. Założono materiał podkładowy Ionosit oraz materiał:\n'+matText('ST28.','docx'));
     else if(tx.startsWith('ekstyrpacja'))o.push('Pacjent skarży się na okresowe bóle samoistne od dłuższego czasu od zęba po urazie, zapalenie miazgi nieodwracalne podjęto decyzję o  '+V('ST28.endo','ekstyrpacja / leczenie endodontyczne')+' zęba '+T);

function nfzIssues(){
  const err=[],warn=[],cs=state.codes,a=AGE();
  for(let i=0;i<cs.length;i++)for(let j=i+1;j<cs.length;j++){const x=cs[i],y=cs[j];
    const k=(NFZ_NOSUM[x]||[]).includes(y)?x:((NFZ_NOSUM[y]||[]).includes(x)?y:null);
    if(k){const o=k===x?y:x;err.push({codes:[x,y],msg:`${k} i ${o} nie mogą być rozliczone razem – pakiet ${k} „nie sumuje się” z ${o}.`});}}
  Object.keys(NFZ_MIN).forEach(c=>{if(!has(c))return;const v=parseFloat(String(state.a[c+'.czas']||'').replace(',','.'));const mn=nfzMin(c);
    if(!isNaN(v)&&v<mn)err.push({codes:[c],msg:`${c}: czas ${num(v)} min jest krótszy niż minimum NFZ ${mn} min${nfzPackages(c)>1?` (${nfzPackages(c)} pakiety × ${NFZ_MIN[c]} min)`:''}.`});});
  ['ST01','ST02'].forEach(c=>{if(!has(c))return;const nowy=(str(state.a[c+'.wer'])||'nowy')==='nowy';teethOf(c).forEach(t=>{const an=getVal('T|'+c+'|'+t+'|'+(nowy?'an2':'an'))||[];
    if(!an.length)err.push({codes:[c],msg:`${c}, ząb ${t}: NFZ wymaga wskazania co najmniej jednego znieczulenia (lista procedur ST1) – inaczej pakiet nie zostanie rozliczony.`});});});
  ['ST30E','ST30G'].forEach(c=>{if(has(c)&&a!==null&&a>=18)err.push({codes:[c],msg:`${c}: pakiety profesjonalnej higienizacji (ST30D–ST30G) są przeznaczone dla dzieci i młodzieży do 18 r.ż.`});});
  const vt=visitTime(),tot=vt.nfz;
  if(vt.decl>SLOT_MIN)warn.push({codes:[],msg:`Pakiety higienizacyjne zajmują ${num(vt.decl)} min – więcej niż standardowa wizyta ${SLOT_MIN} min${vt.extra?`; z doliczeniem 10 min za ekstrakcję / leczenie zachowawcze wizyta trwa ${vt.sug} min`:''}.`});
  if(vt.manual&&vt.hyg.length&&vt.val<vt.nfz)err.push({codes:[],msg:`Czas wizyty ${vt.val} min jest krótszy niż suma minimalnych czasów pakietów NFZ (${vt.nfz} min).`});
  else if(vt.manual&&vt.extra&&vt.val<vt.sug)warn.push({codes:[],msg:`Czas wizyty ${vt.val} min nie zawiera doliczenia 10 min za ekstrakcję / leczenie zachowawcze przy pakiecie higienizacyjnym – wg zasady powinno być ${vt.sug} min.`});
  else if(vt.manual&&vt.hyg.length&&vt.val<vt.decl)warn.push({codes:[],msg:`Czas wizyty ${vt.val} min jest krótszy niż czas pakietów higienizacyjnych wpisany w opisie (${num(vt.decl)} min).`});
  if(cs.some(c=>NFZ_MIN[c])&&(a===null||a<18))warn.push({codes:[],msg:'U dzieci i młodzieży do 18 r.ż. usuwanie złogów – nie częściej niż 1× na 6 miesięcy (komunikat NFZ). Sprawdź datę poprzedniego zabiegu.'});
  cs.forEach(c=>{if(NFZ_LIMIT[c])warn.push({codes:[c],msg:`${c}: limit NFZ – ${NFZ_LIMIT[c]}.`,soft:true});});
  return {err,warn,tot,vt};
}
function nfzBox(){

const STORES=['visits','bodies','segs'];
function idbOpen(){return new Promise((res,rej)=>{
  let done=false;const fin=(f,v)=>{if(!done){done=true;clearTimeout(to);f(v);}};
  const to=setTimeout(()=>fin(rej,new Error('brak odpowiedzi')),4000);
  let rq;try{rq=indexedDB.open('opisyNFZ@'+UID,1);}catch(e){fin(rej,e);return;}
  rq.onupgradeneeded=()=>{const db=rq.result;STORES.forEach(s=>{if(!db.objectStoreNames.contains(s))db.createObjectStore(s);});};
  rq.onsuccess=()=>{const db=rq.result;if(done){try{db.close();}catch(e){}return;}db.onversionchange=()=>{try{db.close();}catch(e){}};fin(res,db);};
  rq.onerror=()=>fin(rej,rq.error||new Error('błąd otwarcia'));
});}
function beIDB(db){
  const tx=(stores,mode,fn)=>new Promise((res,rej)=>{let t;
    try{t=db.transaction(stores,mode,{durability:'strict'});}catch(e){try{t=db.transaction(stores,mode);}catch(e2){rej(e2);return;}}
    t.oncomplete=()=>res();t.onabort=()=>rej(t.error||new Error('zapis przerwany'));
    try{fn(t);}catch(e){try{t.abort();}catch(_){}rej(e);}});

    all(store){let out=[];return tx([store],'readonly',t=>{const s=t.objectStore(store),v=s.getAll(),k=s.getAllKeys();k.onsuccess=()=>{out=k.result.map((key,i)=>[key,v.result[i]]);};}).then(()=>out);},
    get(store,key){let out;return tx([store],'readonly',t=>{const r=t.objectStore(store).get(key);r.onsuccess=()=>{out=r.result;};}).then(()=>out);},
    write(ops){const st=[...new Set(ops.map(o=>o.s))];if(!st.length)return Promise.resolve();
      return tx(st,'readwrite',t=>{ops.forEach(o=>{const s=t.objectStore(o.s);if(o.del)s.delete(o.key);else s.put(o.val,o.key);});});},
    clear(stores){return tx(stores,'readwrite',t=>{stores.forEach(s=>t.objectStore(s).clear());});}};
}
function beLS(){const P='opisyNFZ2@'+UID+'.';
  const keysOf=store=>{const out=[],pre=P+store+'.';for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(pre))out.push(k);}return out;};
  return {kind:'ls',
    async all(store){const pre=P+store+'.',out=[];keysOf(store).forEach(k=>{try{out.push([k.slice(pre.length),JSON.parse(localStorage.getItem(k))]);}catch(e){}});return out;},
    async get(store,key){try{const v=localStorage.getItem(P+store+'.'+key);return v===null?undefined:JSON.parse(v);}catch(e){return undefined;}},
    async write(ops){const undo=[];
      try{ops.forEach(o=>{const k=P+o.s+'.'+o.key;undo.push([k,localStorage.getItem(k)]);if(o.del)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(o.val));});}
      catch(e){undo.reverse().forEach(([k,v])=>{try{if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(_){}});throw e;}},
    async clear(stores){stores.forEach(s=>keysOf(s).forEach(k=>localStorage.removeItem(k)));}};

  if(!be){try{localStorage.setItem('opisyNFZ.probe','1');localStorage.removeItem('opisyNFZ.probe');be=beLS();}catch(e){be=beMem();}}
  be=G.wrapBE(be,'nfz');                                 // każdy zapis szyfrowany kluczem użytkownika
  DB.be=be;DB.kind=be.kind;
  try{DB.migrated=await migrateV1(be);}catch(e){DB.note=(DB.note?DB.note+'; ':'')+'przeniesienie starej historii nie powiodło się: '+(e&&e.message||e);}
  if(be.kind==='idb'){try{await drainLS2(be);}catch(e){}}
  await dbReload();
  await dbFixNos();
  try{const so=await G.store('kv').get('nfz:seg');if(so&&so.over&&typeof so.over==='object'){SEGU={over:so.over,hist:so.hist||{}};segApply();}}catch(e){DB.note=(DB.note?DB.note+'; ':'')+'nie udało się odczytać Twoich wersji stałych tekstów';}
  DB.ready=true;
  storageInfo();
  await refreshGab();
  await draftRestore().catch(()=>false);render();
  sumsPublish();
}

/* Przeniesienie historii z poprzedniej wersji (localStorage: opisyNFZ.hidx, opisyNFZ.h.<id>, opisyNFZ.seg.<skrót>).
   Stare dane są kasowane dopiero po sprawdzeniu, że każdy wpis jest już w nowym magazynie. */
async function migrateV1(be){
  const idx=LS.get('hidx',null);
  if(!Array.isArray(idx))return 0;
  const have=new Map(await be.all('visits'));
  let no=cfg.seq||0;have.forEach(v=>{if(v&&v.no>no)no=v.no;});
  const segOps=[];LS.keys('seg.').forEach(k=>{const v=LS.get(k,null),h=k.slice(4);if(typeof v==='string'&&hashStr(v)===h)segOps.push({s:'segs',key:h,val:v});});
  const rows=idx.filter(x=>x&&typeof x==='object').slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))||String(a.at).localeCompare(String(b.at)));
  const groups=[],ids=[];
  rows.forEach(x=>{const b=LS.get('h.'+x.id,null),hasB=!!(b&&typeof b.txt==='string');
    const m=normMeta(Object.assign({},x,{src:'gen',body:hasB,created:x.at,min:null}));if(!m)return;
    ids.push(m.id);if(have.has(m.id))return;
    m.no=++no;const ops=[{s:'visits',key:m.id,val:m}];if(hasB)ops.push({s:'bodies',key:m.id,val:{txt:b.txt,p:b.p?1:0,snap:b.snap&&typeof b.snap==='object'?b.snap:null}});
    groups.push({id:m.id,meta:m,ops});});
  if(groups.length){
    try{await be.write(segOps.concat(...groups.map(g=>g.ops)));}
    catch(e){if(be.kind!=='ls')throw e;                // za mało miejsca w localStorage na dwie kopie naraz → wpis po wpisie, zwalniając starą kopię
      await be.write(segOps);
      for(const g of groups){try{await be.write(g.ops);}catch(e2){g.meta.body=false;await be.write([{s:'visits',key:g.id,val:g.meta}]);}LS.del('h.'+g.id);}}
  }
  const now=new Set((await be.all('visits')).map(([k])=>k));
  if(ids.every(id=>now.has(id))){LS.keys('h.').forEach(k=>LS.del(k));LS.keys('seg.').forEach(k=>LS.del(k));LS.del('hidx');if(no>(cfg.seq||0)){cfg.seq=no;cfgSave();}}
  return groups.length;
}
/* Wpisy zapisane awaryjnie w localStorage (gdy IndexedDB chwilowo nie działało) wracają do głównej bazy przy następnym uruchomieniu. */
async function drainLS2(idb){
  let ls,vs,bs,sg;try{ls=G.wrapBE(beLS(),'nfz');vs=await ls.all('visits');bs=await ls.all('bodies');sg=await ls.all('segs');}catch(e){return 0;}
  if(!vs.length&&!bs.length&&!sg.length)return 0;
  const cur=new Map(await idb.all('visits')),bodies=new Map(bs),ops=[];let n=0;
  sg.forEach(([k,v])=>{if(typeof v==='string'&&hashStr(v)===k)ops.push({s:'segs',key:k,val:v});});
  vs.forEach(([k,v])=>{const m=normMeta(v);if(!m||m.id!==k)return;const c=cur.get(k);if(c&&String(c.at)>=String(m.at))return;
    ops.push({s:'visits',key:k,val:m});if(bodies.has(k))ops.push({s:'bodies',key:k,val:bodies.get(k)});n++;});
  if(ops.length)await idb.write(ops);
  await ls.clear(STORES);
  return n;
}

/* Stałe fragmenty szablonów (SEG) zapisują się raz, pod kluczem ze skrótu treści, a wpis trzyma do nich odnośniki.
   Opis zajmuje dzięki temu ok. 4× mniej miejsca (także w kopii zapasowej), a zapisany tekst nie zmieni się po późniejszej edycji szablonów. */
function hashStr(t){let h=0x811c9dc5;for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,0x01000193);}return (h>>>0).toString(36)+'_'+t.length.toString(36);}
const SEG0=Object.assign({},SEG);                      // teksty domyślne z szablony.js; wersje użytkownika – SEGU (zaszyfrowane)
let SEGU={over:{},hist:{}};
let SEG_PACK=Object.keys(SEG).filter(k=>typeof SEG[k]==='string'&&SEG[k].length>=120).sort((a,b)=>SEG[b].length-SEG[a].length).map(k=>({v:SEG[k],h:hashStr(SEG[k])}));
function segApply(){
  Object.keys(SEG0).forEach(k=>{const o=SEGU.over[k];SEG[k]=o&&typeof o.txt==='string'?o.txt:SEG0[k];});
  SEG_PACK=Object.keys(SEG).filter(k=>typeof SEG[k]==='string'&&SEG[k].length>=120).sort((a,b)=>SEG[b].length-SEG[a].length).map(k=>({v:SEG[k],h:hashStr(SEG[k])}));
}
const segVer=k=>SEGU.over[k]?SEGU.over[k].ver:1;
function segSet(k,txt){                                 // nowa wersja stałego tekstu; poprzednia do historii
  const cur=SEGU.over[k],h=SEGU.hist[k]||(SEGU.hist[k]=[]);
  h.push({ver:segVer(k),at:cur?cur.at:null,txt:SEG[k]});if(h.length>30)h.splice(0,h.length-30);
  SEGU.over[k]={txt:String(txt),ver:segVer(k)+1,at:new Date().toISOString()};segApply();
  return G.store('kv').put('nfz:seg',SEGU);
}
function unpackTxt(t){return t.replace(/\u0003([0-9a-z_]+)\u0004/g,(m,h)=>DB.segs.has(h)?DB.segs.get(h):'[BRAK FRAGMENTU SZABLONU]');}
function packTxt(txt){
  if(/[\u0003\u0004]/.test(txt))return {txt,p:0,segs:[]};
  let t=txt;const used=[];
  SEG_PACK.forEach(g=>{if(t.indexOf(g.v)<0)return;if(DB.segs.has(g.h)&&DB.segs.get(g.h)!==g.v)return;t=t.split(g.v).join('\u0003'+g.h+'\u0004');used.push(g);});
  if(!used.length)return {txt,p:0,segs:[]};
  const map=new Map(used.map(g=>[g.h,g.v]));
  if(t.replace(/\u0003([0-9a-z_]+)\u0004/g,(m,h)=>map.has(h)?map.get(h):m)!==txt)return {txt,p:0,segs:[]};   // kontrola: po rozpakowaniu musi wyjść identyczny tekst
  return {txt:t,p:1,segs:used.filter(g=>DB.segs.get(g.h)!==g.v)};
}

/* ---------- czas wizyty ----------
   Zasada: pakiet higienizacyjny (ST30, ST30E, ST30G) + ekstrakcja lub leczenie zachowawcze na tej samej wizycie = +10 min do czasu wizyty,
   doliczane raz – niezależnie od liczby zębów i liczby dodatkowych procedur.
   Czas wizyty bez dodatkowych procedur = standardowe 30 min, a gdy same pakiety higienizacyjne zajmują więcej (czas z opisu, nie mniej
   niż minimum NFZ) – czas pakietów. Pole „Czas wizyty” pozwala wpisać własną wartość. */
const HYG_EXTRA=['ST01','ST02','1108','1502','1503','1504','1505','1105','1206'];     // ekstrakcje + leczenie zachowawcze
function visitTime(){
  const hyg=state.codes.filter(c=>NFZ_MIN[c]);
  let nfz=0,decl=0;
  hyg.forEach(c=>{const mn=nfzMin(c),v=parseNum(state.a[c+'.czas']);nfz+=mn;decl+=Math.max(mn,isNaN(v)?0:v);});
  const extraCodes=hyg.length?state.codes.filter(c=>HYG_EXTRA.includes(c)):[];
  const extra=extraCodes.length?10:0;
  const base=Math.max(SLOT_MIN,Math.ceil(decl));                   // wizyta bez dodatkowych procedur
  const sug=base+extra;                                            // podpowiadany czas wizyty
  const raw=str(state.a['sv.min']),man=parseNum(raw),manual=raw!==''&&!isNaN(man)&&man<=1440;
  return {hyg,nfz,decl,extraCodes,extra,base,sug,manual,bad:raw!==''&&!manual,val:manual?Math.round(man):sug};
}
function timeNote(vt){
  const b=vt.base>SLOT_MIN?`${vt.base} min (czas pakietów higienizacyjnych)`:`standardowe ${SLOT_MIN} min`;
  const why=vt.hyg.length
    ?(vt.extra?`${b} + 10 min za ekstrakcję / leczenie zachowawcze przy pakiecie higienizacyjnym (${vt.extraCodes.join(', ')} – doliczane raz) = ${vt.sug} min`
              :`${b}; pakiet higienizacyjny bez ekstrakcji i leczenia zachowawczego – nic się nie dolicza`)
    :`${b}; bez pakietu higienizacyjnego zasada +10 min nie dotyczy`;
  if(vt.manual)return `Czas wizyty wpisany ręcznie: ${vt.val} min. Podpowiedź: ${vt.sug} min – ${why}.`;
  return `Czas wizyty: ${vt.sug} min – ${why}.`;
}

/* ---------- zapis wizyty z generatora ----------
   Jedna wizyta (do „Następny pacjent”) = jeden wpis, aktualizowany przy zmianach. Dwa tryby:
   – z inicjałami: wpis powstaje, gdy wpisano inicjały pacjenta,
   – automatyczny (anonimowy): każda wygenerowana wizyta zapisuje się sama, bez danych pacjenta, z własnym numerem.
   Zapis następuje tylko wtedy, gdy coś się zmieniło. Zanim wpis zostanie nadpisany danymi, które wyglądają na innego pacjenta,
   aplikacja wstrzymuje zapis i pyta. */
function linkKey(){return {age:AGE(),codes:state.codes.slice().sort().join(','),api:str(state.a['sh.api']),gi:str(state.a['sh.gi'])};}
function linkDiff(a,b){                              // czy formularz wygląda na innego pacjenta niż zapisana wizyta (a – zapisana, b – formularz)
  if(a.age!==null&&b.age!==null&&a.age!==b.age)return 'age';
  const A=a.codes?a.codes.split(','):[],B=b.codes?b.codes.split(','):[];
  if(A.some(c=>!B.includes(c))&&B.some(c=>!A.includes(c)))return 'codes';      // zabiegi zamienione (samo dodanie albo usunięcie kodu to poprawka)
  if(a.api&&b.api&&a.gi&&b.gi&&a.api!==b.api&&a.gi!==b.gi)return 'exam';
  return '';
}
function unlinkVisit(){
  const prev=state.savedId?DB.visits.get(state.savedId):null;
  if(prev&&str(state.a['sv.date'])===prev.date&&prev.date!==todayISO())state.a['sv.date']='';   // nowy pacjent → dzisiejsza data, chyba że wpisano inną
  state.savedId=null;state.savedNo=null;state.savedCreated=null;state.savedSig=null;state.pendSig=null;state.saveInfo=null;
  state.skipSave=false;state.iniOk=null;state.diffOk=null;state.link=null;state.vPrice=null;state.vPct=null;state.vRev=null;state.loadedTxt=null;
}
function visitSnap(){return JSON.parse(JSON.stringify({codes:state.codes,a:state.a,teeth:state.teeth,quads:state.quads,plan:state.plan}));}
function autoSave(force){
  if(!state.codes.length){state.saveInfo=null;return null;}
  if(!DB.ready){state.saveInfo={ok:false,why:'wait'};return state.saveInfo;}
  if(state.skipSave&&!force){state.saveInfo={ok:false,why:'skip'};return state.saveInfo;}
  const ini=saveIni(),prev=state.savedId?DB.visits.get(state.savedId):null;
  if(!cfg.auto&&!ini&&!(prev&&!prev.ini)){state.saveInfo={ok:false,why:'ini',kept:prev?whoOf(prev):''};return state.saveInfo;}
  if(prev&&!force){
    if(prev.ini&&ini&&prev.ini!==ini&&state.iniOk!==ini){state.saveInfo={ok:false,why:'inichg',from:prev.ini,to:ini};return state.saveInfo;}
    const lk=linkKey(),dk=JSON.stringify(lk),df=state.link?linkDiff(state.link,lk):'';
    if(df&&state.diffOk!==dk){state.saveInfo={ok:false,why:'diff',what:df,who:whoOf(prev)};return state.saveInfo;}
  }
  const P=nfzPoints(),vt=visitTime(),now=new Date().toISOString(),date=saveDate();
  state.a['sv.date']=date;                                         // data wizyty przypięta przy pierwszym zapisie
  if(!state.savedId){state.savedId=newId();state.savedNo=nextNo();state.savedCreated=now;}
  const id=state.savedId;
  const pk=packTxt(fullTxt()),snap=visitSnap(),ed=!!state.ed;
  const meta=normMeta({id,no:state.savedNo,ini,date,created:state.savedCreated||now,at:now,src:'gen',codes:state.codes.slice(),pts:P.total,price:vPrice(),pct:vPct(),
    revH:visitRevH(),revRate:vRev(),ex:visitExtras(),min:vt.val,miss:ed?edMiss():missCount(),body:true,gab:visitGab()});
  const sig=JSON.stringify([Object.assign({},meta,{at:''}),pk.txt,snap,ed]);
  if(prev&&sig===state.savedSig){state.saveInfo={ok:true,meta:prev};return state.saveInfo;}       // nic się nie zmieniło – bez zapisu
  if(prev&&state.loadedTxt!=null){                                   // wpis dopiero co otwarty z historii: jeśli nic się nie różni, nie zapisuj go ponownie
    const same=state.loadedTxt===pk.txt&&JSON.stringify(Object.assign({},meta,{at:''}))===JSON.stringify(Object.assign({},prev,{at:''}));state.loadedTxt=null;
    if(same){state.savedSig=sig;state.link=linkKey();state.saveInfo={ok:true,meta:prev};return state.saveInfo;}}
  if(sig===state.pendSig)return state.saveInfo;
  state.pendSig=sig;state.saveInfo={ok:true,pending:true,meta};
  const lk=linkKey();
  dbPut(meta,{txt:pk.txt,p:pk.p,snap,ed},pk.segs).then(()=>{
    if(state.savedId===id){if(state.pendSig===sig)state.pendSig=null;state.savedSig=sig;state.link=lk;state.saveInfo={ok:true,meta};}
    refreshSave();
  },e=>{
    if(state.savedId===id){if(state.pendSig===sig)state.pendSig=null;state.saveInfo={ok:false,why:'store',msg:String(e&&e.message||e)};}
    refreshSave();
  });
  return state.saveInfo;
}

function cleanSnap(sn){                              // odczyt zapisanych odpowiedzi (także z wczytanej kopii) – tylko poprawne struktury
  const o={codes:[],a:{},teeth:{},quads:{},plan:null};if(!sn||typeof sn!=='object')return o;
  o.codes=(Array.isArray(sn.codes)?sn.codes:[]).filter((c,i,a)=>typeof c==='string'&&D[c]&&a.indexOf(c)===i);
  // dozwolone wartości odpowiedzi: tekst, liczba, lista tekstów (pola wielokrotnego wyboru) albo lista wierszy (np. kanały przy 1206)
  const okVal=(v,deep)=>typeof v==='string'?v.slice(0,4000):(typeof v==='number'&&isFinite(v))?String(v)
    :Array.isArray(v)?(deep&&v.some(x=>x&&typeof x==='object'&&!Array.isArray(x))?v.slice(0,40).map(x=>okObj(x,false)):v.filter(x=>typeof x==='string').slice(0,80).map(x=>x.slice(0,400))):undefined;
  const okObj=(src,deep)=>{const out={};if(src&&typeof src==='object'&&!Array.isArray(src))Object.keys(src).forEach(k=>{if(k.length>60||k==='__proto__'||k==='constructor'||k==='prototype')return;
    const v=okVal(src[k],deep);if(v!==undefined)out[k]=v;});return out;};
  o.a=okObj(sn.a,true);
  if(sn.teeth&&typeof sn.teeth==='object')Object.keys(sn.teeth).forEach(c=>{const t=sn.teeth[c];if(!D[c]||!t||typeof t!=='object')return;o.teeth[c]={};
    Object.keys(t).forEach(n=>{if(!/^\d{2}$/.test(n))return;const x=t[n]||{};o.teeth[c][n]={s:Array.isArray(x.s)?x.s.filter(s=>SORD.includes(s)):[],f:okObj(x.f,false)};});});
  if(sn.quads&&typeof sn.quads==='object')Object.keys(sn.quads).forEach(c=>{if(D[c]&&Array.isArray(sn.quads[c]))o.quads[c]=sn.quads[c].filter((q,i,a)=>[1,2,3,4].includes(q)&&a.indexOf(q)===i);});
  if(sn.plan&&PLANS[sn.plan.p]&&PLANS[sn.plan.p].v[sn.plan.w])o.plan={p:sn.plan.p,w:sn.plan.w};
  return o;
}

  if(!Array.isArray(state.a['1206.canals'])||!state.a['1206.canals'].length)state.a['1206.canals']=[{}];

function draftNew(date){return {date:date||todayISO(),ini:'',pts:'',revH:'',min:'',ex:[],err:''};}
function draftOf(m){return {id:m.id,date:m.date,ini:m.ini,pts:m.pts?num(m.pts):'',price:num(m.price),pct:m.pct,revH:m.revH?num(m.revH):'',revRate:num(m.revRate),
  min:m.min==null?'':String(m.min),ex:m.ex.map(e=>({a:num((e.c/100).toFixed(2)).replace(/,00$/,''),d:e.d})),err:''};}
function draftParse(d,base){
  const e=[],S=k=>str(d[k]);
  if(!validDate(S('date')))e.push('podaj poprawną datę');
  const pts=S('pts')===''?0:parseNum(S('pts'));if(isNaN(pts)||pts>100000)e.push('punkty – wpisz liczbę, np. 150 albo 61,2');
  const revH=S('revH')===''?0:parseNum(S('revH'));if(isNaN(revH)||revH>24)e.push('przeglądy – liczba godzin od 0 do 24, np. 1,5');
  const mn=S('min')===''?null:parseNum(S('min'));if(mn!==null&&(isNaN(mn)||mn>1440))e.push('czas wizyty – liczba minut');
  const ex=[];(d.ex||[]).forEach((r,i)=>{const a=str(r&&r.a),ds=str(r&&r.d);if(!a&&!ds)return;const c=toCents(a);
    if(!(c>0)||c>1e10)e.push('dodatkowy zarobek '+(i+1)+' – wpisz kwotę większą od 0');else ex.push({c,d:ds.slice(0,120)});});
  let price=cfg.price,pct=cfg.pct,revRate=cfg.rev;
  if(base){price=base.price;pct=base.pct;revRate=base.revRate;
    const p=parseNum(S('price'));if(isNaN(p)||p<=0||p>=100)e.push('stawka za punkt – liczba większa od 0');else price=p;
    const rr=parseNum(S('revRate'));if(isNaN(rr)||rr<=0||rr>100000)e.push('stawka za godzinę przeglądów – liczba większa od 0');else revRate=rr;
    if(isFinite(+d.pct)&&+d.pct>=0&&+d.pct<=100)pct=+d.pct;}
  if(!e.length&&!(pts>0||revH>0||ex.length))e.push('wpisz punkty, godziny przeglądów albo dodatkową kwotę');
  if(e.length)return {ok:false,msg:e.join('; ')};
  const mins=mn!==null?Math.round(mn):(!base&&(pts>0||S('ini'))?SLOT_MIN:null);     // szybki wpis wizyty bez podanego czasu = standardowa wizyta 30 min
  return {ok:true,v:{date:S('date'),ini:S('ini'),pts:r2(pts),price,pct,revH:r2(revH),revRate,ex,min:mins}};
}
function draftCalc(d,base){
  const pts=parseNum(str(d.pts)),rh=parseNum(str(d.revH));
  let price=base?parseNum(str(d.price)):cfg.price;if(!(price>0&&price<100))price=base?base.price:cfg.price;
  let rr=base?parseNum(str(d.revRate)):cfg.rev;if(!(rr>0))rr=base?base.revRate:cfg.rev;
  return calc({pts:isNaN(pts)?0:pts,price,pct:base?+d.pct:cfg.pct,revH:isNaN(rh)||rh>24?0:rh,revRate:rr,ex:(d.ex||[]).map(r=>({c:toCents(str(r&&r.a))})).filter(x=>x.c>0)});
}

/* ---------- historia wizyt ---------- */
function agg(list){

/* ---------- kopia zapasowa ----------

async function backupExport(){
  if(!DB.ready||ui.busy)return;ui.busy=true;
  try{
    const bodies={};(await DB.be.all('bodies')).forEach(([k,v])=>{if(DB.visits.has(k)&&v&&typeof v.txt==='string')bodies[k]=v;});
    const segs={};DB.segs.forEach((v,k)=>{segs[k]=v;});
    const visits=dbList().slice().reverse().map(m=>{const k=calc(m);return Object.assign({},m,{dzien:DOW[dowOf(m.date)],zl_punkty:k.pc/100,zl_lekarz:k.sh/100,zl_przeglady:k.rv/100,zl_dodatkowe:k.ex/100});});
    const data={app:'opisy-nfz',schema:2,exported:new Date().toISOString(),cfg:{price:cfg.price,pct:cfg.pct,rev:cfg.rev,basis:cfg.basis,auto:cfg.auto},visits,bodies,segs};
    if(await saveFile('opisy-nfz-kopia-'+todayISO()+'.json',JSON.stringify(data),'application/json')){
      cfg.lastBackup=new Date().toISOString();cfgSave();ui.msg='';toast('Kopia zapasowa: '+visits.length+' '+plural(visits.length,'wpis','wpisy','wpisów'));}

async function backupImport(file){
  if(!DB.ready||!file)return;
  let data;try{data=JSON.parse(await file.text());}catch(e){ui.msg='Nie wczytano: to nie jest plik kopii zapasowej (nie da się go odczytać).';render();return;}
  if(!data||data.app!=='opisy-nfz'||!Array.isArray(data.visits)){ui.msg='Nie wczytano: to nie jest plik kopii zapasowej tej aplikacji.';render();return;}
  const ops=[];let add=0,upd=0,same=0,bad=0;const wasEmpty=DB.visits.size===0;
  const segs=data.segs&&typeof data.segs==='object'?data.segs:{},bodies=data.bodies&&typeof data.bodies==='object'?data.bodies:{};
  Object.keys(segs).forEach(h=>{const v=segs[h];if(typeof v==='string'&&hashStr(v)===h&&!DB.segs.has(h))ops.push({s:'segs',key:h,val:v});});
  data.visits.forEach(x=>{const m=normMeta(x);if(!m){bad++;return;}
    const cur=DB.visits.get(m.id);if(cur&&String(cur.at)>=String(m.at)){same++;return;}
    const b=Object.prototype.hasOwnProperty.call(bodies,m.id)?bodies[m.id]:null,hasB=!!(b&&typeof b.txt==='string');
    m.body=hasB;ops.push({s:'visits',key:m.id,val:m});

    else if(cur&&cur.body)ops.push({s:'bodies',key:m.id,del:true});
    if(cur)upd++;else add++;});
  try{if(ops.length)await DB.be.write(ops);}catch(e){ui.msg='Nie wczytano kopii – błąd zapisu ('+(e&&e.message||e)+'). Nic nie zostało zmienione.';render();return;}
  DB.bodies.clear();await dbReload();await dbFixNos();if(add||upd){touchData();sumsSched();}
  let cfgNote='';
  if(wasEmpty&&add&&data.cfg&&typeof data.cfg==='object'){const c=data.cfg;   // odtwarzanie na pustej historii (np. nowe urządzenie) – wracają też stawki i tryb zapisu
    if(+c.price>0&&+c.price<100)cfg.price=+c.price;if(PCT_OPTS.includes(+c.pct))cfg.pct=+c.pct;if(+c.rev>0&&+c.rev<=100000)cfg.rev=+c.rev;
    if(c.basis==='share'||c.basis==='full')cfg.basis=c.basis;if(typeof c.auto==='boolean')cfg.auto=c.auto;cfgSave();
    cfgNote=` Przywrócono też ustawienia z kopii: ${num(cfg.price)} zł/pkt, przeglądy ${num(cfg.rev)} zł/h, lekarz ${cfg.pct}%.`;}
  ui.msg=`Wczytano kopię z ${fmtDate(String(data.exported||'').slice(0,10))}: dodano ${add}, zaktualizowano ${upd}, bez zmian ${same}${bad?', pominięto błędnych '+bad:''}.`+cfgNote;
  render();

/* ---------- statystyki ----------
   Wszystkie zestawienia liczone są z tych samych wpisów tą samą funkcją agg(), w groszach – dlatego sumy dni, tygodni i miesięcy
   są zawsze równe sumie zakresu. Dzień przepracowany = dzień z co najmniej jednym wpisem. */
function rangeOf(p){
  const t=todayISO(),m1=t.slice(0,8)+'01';
  if(p==='today')return [t,t];
  if(p==='week'){const w=weekOf(t);return [w.from,w.to];}
  if(p==='month')return [m1,monthEnd(m1)];
  if(p==='prev'){const f=monthShift(m1,-1);return [f,monthEnd(f)];}
  if(p==='y12')return [monthShift(m1,-11),monthEnd(m1)];
  if(p==='year')return [t.slice(0,4)+'-01-01',t.slice(0,4)+'-12-31'];
  const l=dbList();if(!l.length)return [t,t];const mn=l[l.length-1].date,mx=l[0].date;return [mn,mx>t?mx:t];   // „all”
}
const PRESETS=[['today','Dziś'],['week','Ten tydzień'],['month','Ten miesiąc'],['prev','Poprzedni miesiąc'],['y12','Ostatnie 12 mies.'],['year','Ten rok'],['all','Wszystko']];
function curRange(){
  const r=ui.range;
  if(r.p==='custom'){let f=validDate(r.from)?r.from:todayISO(),t=validDate(r.to)?r.to:f;if(t<f){const x=f;f=t;t=x;}return {p:'custom',from:f,to:t};}
  const x=rangeOf(r.p);return {p:r.p,from:x[0],to:x[1]};
}
function rangeEnd(from,to,last){const t=todayISO();let end=to;if(to>t){end=from<=t?t:from;if(last&&last>end)end=last<to?last:to;}return end;}   // dni z przyszłości liczą się tylko do ostatniego wpisu
function calDays(from,to,last){return Math.max(1,daysBetween(from,rangeEnd(from,to,last))+1);}   // dni kalendarzowe zakresu
/* Ciągła oś czasu wykresów tygodniowego i miesięcznego: okres bez wpisów (np. urlop) to słupek 0 zł, a nie „sklejona” oś.
   Zer nie rysujemy przed pierwszym wpisem w historii (brak danych ≠ brak zarobku) ani w przyszłości; pusty, niepełny okres na początku zakresu pomijamy. */
function periodRows(kind,list,R,g){
  if(!list.length)return g;
  const all=dbList(),first=all.length?all[all.length-1].date:R.from,end=rangeEnd(R.from,R.to,lastDate(list)),start=first>R.from?first:R.from;
  const per=kind==='w'?d=>{const w=weekOf(d);return {k:w.key,from:w.from,to:w.to};}:d=>{const f=d.slice(0,8)+'01';return {k:d.slice(0,7),from:f,to:monthEnd(f)};};
  const by=new Map(g.map(x=>[x.k,x])),out=[];
  let p=per(start);if(p.from<start&&!by.has(p.k))p=per(addDays(p.to,1));
  for(let i=0;p.from<=end&&i<5000;i++){out.push(Object.assign({},by.get(p.k)||{k:p.k,items:[],A:agg([]),empty:true},{from:p.from}));p=per(addDays(p.to,1));}
  return out;
}
const lastDate=items=>items.reduce((mx,m)=>m.date>mx?m.date:mx,'');
const avgC=(c,n)=>n?Math.round(c/n):0;
function visTotal(items){return items.reduce((s,m)=>s+(isVisit(m)?calc(m).total:0),0);}
function grp(list,keyFn){const mp=new Map();list.forEach(x=>{const k=keyFn(x);if(!mp.has(k))mp.set(k,[]);mp.get(k).push(x);});
  return [...mp.entries()].sort((a,b)=>a[0]<b[0]?-1:a[0]>b[0]?1:0).map(e=>({k:e[0],items:e[1],A:agg(e[1])}));}
function tipOf(title,A,foot){const r=[['pe',basisLab(),fmtC(A.pe)]];if(A.rv)r.push(['rv','Przeglądy',fmtC(A.rv)]);if(A.ex)r.push(['ex','Dodatkowe',fmtC(A.ex)]);

/* wykres słupkowy (skumulowany wg źródła przychodu): cienkie słupki, 2 px przerwy między segmentami, zaokrąglony tylko koniec z danymi,
   siatka z cienkich linii, etykieta wartości tylko przy najwyższym i ostatnim słupku – resztę podaje oś, podpowiedź i tabela pod wykresem */
function niceMax(v){if(!(v>0))return 100;const p=Math.pow(10,Math.floor(Math.log10(v))),n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p;}
function barChart(cid,rows,keys,opt){
  opt=opt||{};
  if(!rows.length)return '<p class="note">Brak wpisów w wybranym zakresie.</p>';
  const H=190,T=20,B=38,BW=rows.length>20?40:52,bw=22,W=rows.length*BW+10;
  const mx=niceMax(Math.max(...rows.map(r=>r.tot))/100)*100||100,y=v=>T+H-(v/mx)*H,ticks=[0,1,2,3,4].map(i=>mx*i/4),big=mx/100>=10000;
  const axis=`<svg class="ch-axis" width="58" height="${T+H+B}" aria-hidden="true">${ticks.map(t=>`<text x="52" y="${(y(t)+4).toFixed(1)}" text-anchor="end">${big?fmtP(t/100000)+' tys.':fmtP(t/100)}</text>`).join('')}</svg>`;
  let iMax=0;rows.forEach((r,i)=>{if(r.tot>rows[iMax].tot)iMax=i;});
  const bands=rows.map((r,i)=>{
    const x=5+i*BW+(BW-bw)/2,pres=keys.filter(k=>r.vals[k]>0);let acc=0,segs='';
    pres.forEach((k,j)=>{const v=r.vals[k],y1=y(acc+v),h=Math.max(0,(y(acc)-y1)-(j>0?2:0));acc+=v;if(h<=0)return;

const ROWS=[[18,17,16,15,14,13,12,11,0,21,22,23,24,25,26,27,28],[55,54,53,52,51,0,61,62,63,64,65],[85,84,83,82,81,0,71,72,73,74,75],[48,47,46,45,44,43,42,41,0,31,32,33,34,35,36,37,38]];

function odoHTML(code,mode){
  const sel=state.teeth[code]||{}; const qs=state.quads[code]||[];
  const rows=ROWS.map((r,ri)=>{const lower=ri>=2;const prim=ri===1||ri===2;

      const n=`<span class="n">${t}</span>`;
      return `<div class="tooth${prim?' prim':''}${isSel?' sel':''}${inq?' inq':''}" data-act="tooth" data-code="${code}" data-t="${t}" role="button" tabindex="0" aria-pressed="${isSel}" aria-label="ząb ${t}">${lower?'':n}${toothSVG(code,t,mode==='surf'?surfs:[])}${lower?n:''}</div>`;}).join('')+'</div>'+(ri===1?'<div class="odo-mid"></div>':'');}).join('');
  let extra='';
  if(mode==='quad'||mode==='mixed') extra=`<div class="quadbar">${[1,2,3,4].map(q=>`<button type="button" class="chip${qs.includes(q)?' on':''}" data-act="quad" data-code="${code}" data-q="${q}">Ćwiartka ${q}<small>${['','prawa górna','lewa górna','lewa dolna','prawa dolna'][q]}</small></button>`).join('')}<button type="button" class="chip" data-act="quadset" data-code="${code}" data-q="1,2">Szczęka</button><button type="button" class="chip" data-act="quadset" data-code="${code}" data-q="3,4">Żuchwa</button><button type="button" class="chip" data-act="quadset" data-code="${code}" data-q="">Wyczyść</button></div>`;
  const leg=mode==='mixed'?'<div class="legend">Ćwiartkę zaznaczasz przyciskami pod diagramem (podświetla się na diagramie), ząb – kliknięciem w ząb. Można jedno albo oba.</div>':mode==='surf'?'<div class="legend">Kliknij numer zęba, by go zaznaczyć; kliknij pole kwadratu, by zaznaczyć powierzchnię (M, D, O/I, B/W, P/L). Linia przerywana = zęby mleczne.</div>':'<div class="legend">Zęby mleczne: rzędy środkowe (linia przerywana).</div>';

    else if(d.diag){if(d.diag.mode==='quad')where=(state.quads[c]||[]).length?'ćwiartki '+(state.quads[c]||[]).slice().sort().join(', '):'—';else{const ts=teethOf(c);where=ts.length?ts.map(t=>{const s=surfOf(c,t);return t+(d.diag.mode==='surf'&&s.length?' '+SORD.filter(x=>s.includes(x)).join(''):'');}).join(', '):'—';}}

  const sum=`<section class="card"><h2>Do diagramu i rozliczenia</h2><p class="note" style="margin:0 0 8px">Ściąga do wpisania w programie gabinetu – nie trafia do kopiowanego opisu.</p><div style="overflow-x:auto"><table class="sum"><thead><tr><th>Kod</th><th>ICD-10 wg pliku</th><th>Zaznaczone na diagramie</th><th>Min. czas NFZ</th><th>Orientacyjnie (wycena AOTMiT)</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;

}

async function copyText(s,msg){
  msg=msg||'Skopiowano';
  try{await navigator.clipboard.writeText(s);toast(msg);return;}catch(e){}
  const ta=$('#clip');ta.value=s;ta.select();try{document.execCommand('copy');toast(msg);}catch(e){toast('Nie udało się skopiować – zaznacz tekst ręcznie');}
}
function toggleTooth(code,t){

}
