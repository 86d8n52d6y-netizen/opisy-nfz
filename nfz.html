  if(a==='automode'){cfg.auto=!cfg.auto;cfgSave();render();toast(cfg.auto?'Zapis automatyczny włączony – wizyty zapisują się bez inicjałów':'Zapis tylko po wpisaniu inicjałów');return;}
  if(a==='basis'){cfg.basis=el.dataset.v==='share'?'share':'full';cfgSave();render();return;}
  if(a==='detach'||a==='savenew'){unlinkVisit();render();toast('To będzie osobna wizyta – poprzedni wpis zostaje bez zmian');return;}
  if(a==='savefix'||a==='saveforce'){state.iniOk=saveIni();state.diffOk=JSON.stringify(linkKey());state.skipSave=false;render();return;}
  if(a==='xadd'){const s=el.dataset.s,arr=exArr(s);arr.push({a:'',d:''});if(s==='v')rerenderSettle();else render();const f=document.querySelector('[data-x="'+s+'|'+(arr.length-1)+'|a"]');if(f)f.focus();return;}
  if(a==='xdel'){const s=el.dataset.s;exArr(s).splice(+el.dataset.i,1);if(s==='v'){rerenderSettle();autoSave();refreshSave();}else render();return;}
  if(a==='reset'){const saved=!!(state.saveInfo&&state.saveInfo.ok);
    if(!saved&&state.codes.length&&!arm(el,'Wizyta nie jest zapisana – kliknij ponownie, aby wyczyścić'))return;
    if(state.step===3)autoSave();
    resetVisit();render();window.scrollTo(0,0);return;}
  /* historia */
  if(a==='qsave'){quickSave();return;}
  if(a==='eopen'){const m=DB.visits.get(el.dataset.id);if(m){ui.edit=draftOf(m);render();const c=document.getElementById('hist-'+m.id);if(c)c.scrollIntoView({block:'center'});}return;}
  if(a==='ecancel'){ui.edit=null;render();return;}
  if(a==='epct'){if(ui.edit){ui.edit.pct=+el.dataset.v;render();}return;}
  if(a==='esave'){editSave();return;}
  if(a==='hcopy'){const id=el.dataset.id,c=DB.bodies.get(id);
    if(c){const t=bodyText(c);if(t)copyText(t);else toast('Ten wpis nie ma zapisanego opisu');return;}
    dbBody(id).then(b=>{const t=bodyText(b);if(t)copyText(t);else toast('Ten wpis nie ma zapisanego opisu');},()=>toast('Nie udało się odczytać opisu'));return;}
  if(a==='hshow'){const box=document.getElementById('htxt-'+el.dataset.id);if(!box)return;const open=box.classList.contains('hidden');
    const fin=()=>{box.classList.toggle('hidden',!open);el.textContent=open?'Ukryj opis':'Pokaż opis';el.setAttribute('aria-expanded',String(open));};
    if(open&&!box.dataset.ok){dbBody(el.dataset.id).then(b=>{box.textContent=bodyText(b)||'Brak treści tego wpisu.';box.dataset.ok='1';fin();},()=>toast('Nie udało się odczytać opisu'));}else fin();return;}
  if(a==='hopen'){openEntry(el);return;}
  if(a==='hdel'){if(!arm(el,'kliknij ponownie, aby usunąć'))return;const id=el.dataset.id;
    dbDel([id]).then(()=>{if(state.savedId===id){unlinkVisit();state.skipSave=true;}if(ui.edit&&ui.edit.id===id)ui.edit=null;render();toast('Usunięto wpis');},()=>toast('Nie udało się usunąć wpisu'));return;}
  if(a==='hclear'){if(!arm(el,'kliknij ponownie – usunie wszystkie wpisy i opisy',3600))return;
    DB.be.clear(STORES).then(()=>{DB.bodies.clear();return dbReload();}).then(()=>{if(state.savedId){unlinkVisit();state.skipSave=true;}ui.edit=null;touchData();render();toast('Historia wyczyszczona');},()=>toast('Nie udało się wyczyścić historii'));return;}
  if(a==='hold'){if(!arm(el,'kliknij ponownie – usunie teksty opisów, kwoty zostaną',3600))return;const cut=histCutoff(),ids=dbList().filter(m=>m.body&&m.date<cut).map(m=>m.id);
    dbDropBodies(ids).then(()=>{render();toast('Usunięto teksty opisów: '+ids.length+' – wpisy i kwoty zostały');},()=>toast('Nie udało się usunąć opisów'));return;}
  if(a==='hmore'){ui.lim+=40;render();return;}
  if(a==='hexport'){histExport();return;}
  /* statystyki i ustawienia */
  if(a==='range'){ui.range={p:el.dataset.p,from:'',to:''};render();return;}
  if(a==='crashreset'){resetVisit();ui.edit=null;ui.quick=null;state.step=1;render();return;}
  if(a==='tab'){ui.tab=el.dataset.t;render();return;}
  if(a==='dowm'){ui.dowM=el.dataset.v;render();return;}
  if(a==='bkexport'){backupExport();return;}
  if(a==='bkpick'){const f=document.getElementById('bk-file');if(f)f.click();return;}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')tipHide();
  if(e.key==='Enter'&&e.target.id==='codeIn'){e.preventDefault();addCodes(e.target.value);render();setTimeout(()=>{const i=$('#codeIn');if(i)i.focus();},0);}
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('tooth')){e.preventDefault();e.target.click();}
  if(e.key==='Enter'&&e.target.tagName==='INPUT'){const fm=e.target.closest('[data-form]');if(fm){e.preventDefault();if(fm.dataset.form==='q')quickSave();else editSave();}}
});
function cardOf(el){const c=el.closest('section.card');if(!c)return null;return c.id==='card-shared'?'shared':c.id.replace('card-','');}
function afterChange(el){
  const card=cardOf(el);
  if(state.step===2){
    if(card==='shared'){rerenderCard('shared');state.codes.forEach(c=>{if(D[c].fields||D[c].perTooth)rerenderCard(c);});}
    else if(card)rerenderCard(card);
  } else render();
}
let edT=null;
document.addEventListener('input',e=>{
  const t=e.target,ds=t.dataset||{};
  if(t.id==='edTxt'&&state.ed){state.ed.txt=t.value;clearTimeout(edT);edT=setTimeout(()=>{autoSave();refreshSave();const n=document.getElementById('ed-note');if(n){const k=edMiss();n.textContent=(genTxt()!==state.ed.gen?'Formularz zmienił się po edycji tekstu – Twój tekst nie został nadpisany.':'Tekst edytowany ręcznie – zmiany w formularzu go nie nadpiszą.')+(k?` W tekście ${k===1?'jest':'są'} ${k} ${plural(k,'pole','pola','pól')} [UZUPEŁNIJ].`:'');}},500);return;}
  if(ds.cfg){const v=parseNum(t.value);
    if(ds.cfg==='price'&&v>0&&v<100){cfg.price=v;cfgSave();if(state.vPrice!=null)state.vPrice=v;if(state.step===3){refreshMoney();renderBar();}}
    if(ds.cfg==='rev'&&v>0&&v<=100000){cfg.rev=v;cfgSave();if(state.vRev!=null)state.vRev=v;}
    const o1=document.querySelector('[data-o="exprice"]');if(o1)o1.textContent=fmtC(centsPts(100,cfg.price));
    const o2=document.querySelector('[data-o="exrev"]');if(o2)o2.textContent=fmtC(centsHours(1.5,cfg.rev));
    return;}
  if(t.id==='segTxt'&&ui.seg){ui.seg.txt=t.value;return;}
  if(ds.ui==='segq'){ui.segq=t.value;const l=document.getElementById('seglist');if(l)l.innerHTML=segListHTML();return;}
  if(ds.ui){if(ds.ui==='q'){ui.q=t.value;ui.lim=40;const l=document.getElementById('hist-list');if(l){l.innerHTML=histListHTML();prefetchBodies();}}return;}
  if(ds.f){const p=ds.f.split('.'),d=p[0]==='q'?ui.quick:ui.edit;if(d){d[p[1]]=t.value;d.err='';const o=document.querySelector('[data-o="'+p[0]+'sum"]');if(o)o.innerHTML=draftSumHTML(p[0]);}return;}
  if(ds.x){const p=ds.x.split('|'),arr=exArr(p[0]);if(!arr[+p[1]])arr[+p[1]]={a:'',d:''};arr[+p[1]][p[2]]=t.value;
    if(p[2]==='a')t.classList.toggle('empty',t.value.trim()!==''&&!(toCents(t.value)>0));
    if(p[0]==='v'){refreshMoney();renderBar();}else{const d=p[0]==='q'?ui.quick:ui.edit;if(d)d.err='';const o=document.querySelector('[data-o="'+p[0]+'sum"]');if(o)o.innerHTML=draftSumHTML(p[0]);}
    return;}
  const k=ds.key;if(!k)return;
  setVal(k,t.value);
  if(ds.settle){const v=t.value.trim(),n=parseNum(v);t.classList.toggle('empty',v!==''&&(isNaN(n)||n>(k==='sv.revH'?24:1440)));refreshMoney();renderBar();return;}
  if(k==='sh.age'&&state.step===1){const pl=document.querySelector('.plans');if(pl){const x=document.createElement('div');x.innerHTML=plansHTML();pl.replaceWith(x.firstElementChild);}refreshNfz();}
  if(!ds.opt)t.classList.toggle('empty',!t.value.trim());
  const lab=t.closest('.f')&&t.closest('.f').querySelector('label .need');if(lab&&t.value.trim())lab.remove();
  renderBar();
});
document.addEventListener('change',e=>{
  const t=e.target,ds=t.dataset||{};
  if(t.id==='bk-file'){const f=t.files&&t.files[0];t.value='';if(f)backupImport(f);return;}
  if(ds.setn||ds.setc){const z=(cfg.sets||[]).find(x=>x.id===(ds.setn||ds.setc));if(!z)return;
    if(ds.setn){const n=t.value.replace(/[<>]/g,'').trim().slice(0,60);if(n)z.name=n;else t.value=z.name;}
    else{const cs=[...new Set((t.value.toUpperCase().replace(/\b23\.(\d{4})\b/g,'$1').match(/[A-Z]*\d+[A-Z]?/g)||[]).filter(c=>D[c]))].slice(0,30);if(cs.length)z.codes=cs;else toast('Zestaw musi mieć co najmniej jeden znany kod');t.value=z.codes.join(', ');}
    cfgSave();return;}
  if(ds.cfg){t.value=num(ds.cfg==='rev'?cfg.rev:(state.step===3?vPrice():cfg.price));if(state.step===3){autoSave();refreshSave();}return;}   // bez przebudowy widoku – nie gubi kliknięcia
  if(ds.ui==='from'||ds.ui==='to'){const R=curRange();let f=ds.ui==='from'?t.value:R.from,to=ds.ui==='to'?t.value:R.to;
    if(validDate(f)&&validDate(to)&&to<f){if(ds.ui==='from')to=f;else f=to;}      // zmieniane pole wygrywa: drugie dopasowuje się, zamiast zamieniać daty miejscami
    ui.range={p:'custom',from:f,to};render();return;}
  if(ds.f||ds.ui)return;
  if(ds.x){if(ds.x.charAt(0)==='v'){autoSave();refreshSave();}return;}
  const k=ds.key;if(!k)return;
  setVal(k,t.value);
  if(ds.settle){autoSave();refreshSave();return;}
  if(k==='sv.date'){refreshGab().then(()=>{if(state.step===3)render();});}
  if((k==='sv.ini'||k==='sv.date'||k==='sv.gab')&&state.step===3){autoSave();refreshSave();return;}
  if(t.tagName==='SELECT'){afterChange(t);return;}
  if(k==='sh.age'&&state.step===2){afterChange(t);}
});
/* podpowiedzi na wykresach: wskaźnik, dotyk i klawiatura pokazują to samo */
let tipEl=null;
function tipFrom(e,pos){const el=e.target&&e.target.closest?e.target.closest('[data-tip]'):null;
  if(!el){if(tipEl){tipEl=null;tipHide();}return;}
  tipEl=el;tipShow(el,pos?e.clientX:null,pos?e.clientY:null);}
document.addEventListener('pointermove',e=>tipFrom(e,true));
document.addEventListener('pointerdown',e=>tipFrom(e,true));
document.addEventListener('focusin',e=>tipFrom(e,false));
document.addEventListener('focusout',e=>{if(e.target&&e.target.closest&&e.target.closest('[data-tip]')){tipEl=null;tipHide();}});
window.addEventListener('scroll',()=>{tipEl=null;tipHide();},true);
/* po powrocie do karty – odśwież dane zapisane w innej karcie */
document.addEventListener('visibilitychange',()=>{
  if(!DB.ready)return;
  if(document.visibilityState!=='visible'){if(state.step===3)autoSave();return;}   // chowana karta: dopisz ostatnie zmiany rozliczenia
  const sig=()=>DB.visits.size+':'+[...DB.visits.values()].reduce((mx,v)=>v.at>mx?v.at:mx,'');
  const before=sig();
  dbReload().then(async()=>{if(sig()===before)return;DB.bodies.clear();await dbFixNos();if(state.step>=4&&!ui.edit)render();else{renderSteps();renderBar();}}).catch(()=>{});
});
window.addEventListener('storage',e=>{                // ustawienia zmienione w innej karcie tej samej przeglądarki – żeby karty nie nadpisywały sobie stawek
  if(e.key!==LSP+'cfg'||!e.newValue)return;
  try{const c=JSON.parse(e.newValue);if(!c||typeof c!=='object')return;cfgApply(cfg,c);if(DB.ready&&!ui.edit&&!document.hasFocus())render();}catch(_){}
});
window.addEventListener('pagehide',()=>{if(DB.ready&&state.step===3)autoSave();draftSaveNow();});
render();
dbInit().then(()=>{if(state.step>=3)render();else{renderSteps();renderBar();const lb=document.getElementById('link-ban');if(lb)refreshSave();}},
  e=>{DB.be=beMem();DB.kind='mem';DB.note=String(e&&e.message||e);DB.ready=true;renderSteps();});
</script>
